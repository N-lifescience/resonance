## cover · 표지
@연출 자리가 정리될 때까지 화면 옆에 말없이 서서 학생들이 제목을 읽게 둔다.
자, 화면 제목부터 같이 읽어 볼까요? 배추는 왜 절여질까.
생명과학 시간인데 제목이 꼭 요리 프로그램 같죠. 미리 말해 두는데, 오늘 김치 담그는 법은 안 가르쳐 줘요. 선생님도 잘 몰라요.
대신 김치를 담글 때 배추 속에서 무슨 일이 벌어지는지, 세포 하나 크기로 줄어들어서 들여다볼 거예요.
오른쪽 그림을 보세요. 갈색 두꺼운 테두리가 있고, 그 안에 초록색 주머니가 있죠. 그런데 초록 주머니가 갈색 테두리에서 뚝 떨어져 있어요. 그리고 파란 화살표들이 바깥쪽으로 나가고 있고요.
이 그림이 무슨 장면인지 지금은 몰라도 괜찮아요. 수업이 끝날 때쯤이면 여러분이 이 그림을 선생님 대신 설명하게 될 거예요. 오늘 수업의 진짜 목표는 사실 그거 하나예요.

## goal · 학습 목표
학습 목표는 세 개예요. 하나씩 짧게 볼게요.
첫째, 삼투가 일어나는 방향을 두 용액의 농도로 설명한다. 물이 어느 쪽으로 가는지 농도만 보고 말할 수 있으면 됩니다.
둘째, 식물 세포의 흡수력을 삼투압과 팽압으로 설명한다. 낯선 낱말이 세 개나 나오죠. 흡수력, 삼투압, 팽압. 지금은 이름만 들어 두세요. 수업 중간에 이 셋을 식 하나로 묶을 거예요.
셋째, 농도가 다른 용액에 넣은 적혈구와 식물 세포의 변화를 비교한다. 같은 소금물에 넣었는데 한 세포는 터지고 한 세포는 버텨요. 왜 그런지가 셋째 목표예요.
이 셋은 따로 노는 목표가 아니에요. 물이 어느 쪽으로 가는가, 세포가 물을 얼마나 세게 빨아들이는가, 그래서 세포 모양이 어떻게 되는가. 한 줄로 이어지는 이야기예요. 그 이야기를 배추 한 포기로 시작해 볼게요.

## open · 소금을 뿌린 배추
@연출 목소리를 낮추고 속도를 늦춘다.
집에서 김치 담그는 걸 본 적 있는 사람? 손은 안 들어도 돼요. 머릿속으로만 떠올려 보세요.
커다란 그릇에 배추를 펴 놓고, 잎 사이사이에 굵은 소금을 뿌려요. 처음에는 배추가 빳빳해요. 잎을 들면 꼿꼿하게 서 있고, 줄기를 꺾으면 똑 하고 부러지죠.
그런데 몇 시간 뒤에 다시 보면 어때요? 화면 오른쪽 그림처럼 잎이 흐물흐물 늘어져 있어요. 흔히 숨이 죽었다고 하죠.
그리고 그릇 바닥을 보면 물이 고여 있어요.
@연출 잠깐 말을 멈췄다가 손가락 하나를 들어 올린다.
여기서 이상한 점이 하나 있어요. 우리는 소금만 뿌렸어요. 물은 한 방울도 붓지 않았어요. 그런데 물이 생겼어요.
@질문 그릇에 고인 이 물은 도대체 어디에서 나왔을까요? 공책에 내 생각을 한 문장으로 적어 보세요.
@대기 40초 공책에 한 문장으로 적게 하고 교실을 돌며 몇 명의 답을 읽는다
@예상 소금이 녹아서 생긴 물 / 배추 안에서 나온 물 / 공기 중의 물기가 달라붙은 것
@조작 학생 답 하나를 골라 화면 입력칸에 그대로 적고 「보내기」를 누른다.
여러 답이 나왔네요. 소금이 녹아서 물이 됐다는 답이 꽤 많아요. 그럴듯해요. 소금이 녹아 없어지는 걸 눈으로 봤으니까요.
그런데 하나만 따져 봅시다. 소금은 물에 녹는 거예요. 녹으면서 물을 만들어 내지는 않아요. 물이 먼저 어딘가에서 나와야 소금이 녹을 수 있겠죠.
그럼 가장 유력한 후보는 배추 자신이에요. 그런데 그렇다면 질문이 하나 더 따라와요. 배추 안에 얌전히 있던 물이 왜 굳이 밖으로 나왔을까요? 우리는 소금을 뿌렸을 뿐인데요.
정답은 지금 말하지 않을게요. 방금 적은 그 한 문장, 지우지 말고 두세요. 수업 마지막에 오늘 배운 낱말로 다시 고쳐 쓸 거예요.

## osmosis · 삼투와 세 가지 용액
@연출 정의 상자 옆으로 가서 손바닥으로 상자를 가리킨다.
이 수수께끼를 풀려면 낱말 하나가 필요해요. 삼투예요. 정의는 정확해야 하니까 화면 상자의 문장을 같이 읽어 봅시다.
선택적 투과성 막을 사이에 두고 농도가 다른 두 용액이 있을 때, 물이 용질 농도가 낮은 쪽에서 높은 쪽으로 이동하는 현상.
한 번에 들으면 길죠. 조각내 볼게요. 조건이 두 개, 결과가 하나예요.
조건 하나, 막이 있다. 그냥 막이 아니라 선택적 투과성 막이에요. 골라서 통과시키는 막이죠. 바로 아래 회색 글을 보세요. 세포막은 물을 잘 통과시키지만 설탕 같은 용질은 잘 통과시키지 않는다. 물은 들여보내고 설탕은 돌려보내는 깐깐한 문지기라고 생각하면 돼요.
조건 둘, 막 양쪽 용액의 농도가 다르다. 양쪽 농도가 같으면 이야기가 시작되지 않아요.
그리고 결과, 물이 용질 농도가 낮은 쪽에서 높은 쪽으로 이동한다.
@질문 여기서 많이들 걸려 넘어져요. 물은 묽은 쪽에서 진한 쪽으로 갈까요, 진한 쪽에서 묽은 쪽으로 갈까요? 손가락으로 방향을 가리켜 보세요.
@예상 묽은 쪽에서 진한 쪽으로 / 진한 쪽에서 묽은 쪽으로
@대기 4초 손가락으로 방향을 가리키게 한다
묽은 쪽에서 진한 쪽이에요. 헷갈리는 이유가 있어요. 물에 잉크 한 방울을 떨어뜨리면 진한 곳에서 묽은 곳으로 퍼지죠. 그 장면이 머리에 있으니까, 물도 진한 쪽에서 출발할 것 같은 거예요. 그런데 삼투에서 움직이는 주인공은 용질이 아니라 물이에요.
물 입장에서 생각해 보세요. 용질이 많은 쪽은 같은 부피 안에 물이 상대적으로 적은 쪽이에요. 그러니까 용질 농도가 높은 쪽으로 물이 간다는 말은, 물이 많은 쪽에서 적은 쪽으로 간다는 말과 같은 이야기예요.
공책에 정의를 적읍시다. 삼투, 물이 용질 농도가 낮은 쪽에서 높은 쪽으로 이동하는 현상. 주어가 물이라는 것, 동그라미 쳐 두세요.
@대기 20초 정의를 받아 적게 한다
이제 아래 세 칸을 보세요. 세포를 어떤 용액에 넣느냐에 따라 용액 이름이 세 가지예요. 그림에서 초록 테두리가 세포, 주황 점이 용질이에요.
왼쪽은 저장액. 세포 안보다 용질 농도가 낮은 용액이에요. 세포 바깥에 주황 점이 하나뿐이죠.
가운데는 등장액. 세포 안과 용질 농도가 같은 용액이에요.
오른쪽은 고장액. 세포 안보다 용질 농도가 높은 용액. 바깥에 주황 점이 우글우글하죠.
@질문 그럼 방금 적은 정의를 붙여 봅시다. 세포를 고장액에 넣으면 물은 어느 쪽으로 더 많이 갈까요? 세포 안에서 밖으로, 아니면 밖에서 안으로?
@예상 세포 안에서 밖으로 / 밖에서 안으로
@대기 5초
세포 안에서 밖으로요. 바깥이 더 진하니까 물은 진한 바깥으로 더 많이 가요. 저장액이면 거꾸로 바깥에서 세포 안으로 더 많이 들어오고요.
@연출 컵을 하나 들어 올리는 시늉을 한다.
그런데 하나 물어볼게요. 선생님이 설탕물 한 컵을 딱 들고 이렇게 말해요. 이 설탕물은 고장액입니다.
@질문 이 말, 맞는 말일까요? 컵만 보고 고장액인지 저장액인지 정할 수 있을까요?
@예상 진하면 고장액이요 / 모르겠어요 / 뭐랑 비교하는지 알아야 해요
@대기 8초 짝과 한마디씩 나누게 한다

### ▶1
화면 아래에 열린 문장이 답이에요. 저장액과 고장액은 세포 안 용액과 견주어 부르는 이름이다. 같은 용액도 어느 세포와 견주느냐에 따라 이름이 달라진다.
세 칸 설명을 다시 보세요. 세포 안보다, 세포 안과, 세포 안보다. 전부 기준이 세포 안이에요.
그러니까 컵 하나만 들고는 정할 수 없어요. 세포 안이 그 컵보다 묽은 세포에게는 고장액이고, 세포 안이 그 컵보다 진한 세포에게는 저장액이에요. 같은 컵인데 누구 옆에 서느냐에 따라 이름이 바뀌는 거죠.
@연출 목소리를 바꿔 문제집 선지를 읽듯이 또박또박 말한다.
고장액은 농도가 높은 용액이다.
이런 문장이 선지로 나오면 바로 동그라미 치지 마세요. 무엇보다 높은지가 빠져 있어요. 정확한 문장은 세포 안보다 용질 농도가 높은 용액이에요.
@생략가능(같은 내용의 일상 비유) 키가 크다고 말할 때도 누구보다 큰지가 있어야 뜻이 생기잖아요. 저장액과 고장액도 그런 견주는 말이에요.
그럼 정의 속 그 문장, 물이 농도가 낮은 쪽에서 높은 쪽으로 이동한다. 이게 정말인지 막 바로 앞까지 가서 직접 봅시다.

## membrane · 막을 사이에 둔 물의 이동
@대기 5초 입자가 움직이는 모습을 말없이 보게 한다
여기가 오늘의 첫 번째 실험실이에요. 상자 가운데 점선이 막이에요. 작고 파란 점이 물 입자예요. 처음에 왼쪽에 마흔다섯 개, 오른쪽에 마흔다섯 개를 넣어 두었어요. 크고 주황색인 설탕 입자는 아직 하나도 없어요.
오른쪽 아래 그림은 가운데에 막이 있는 U자관이에요. 양쪽 수면 높이를 비교할 수 있죠.
화면 문장을 읽어 보세요. 양쪽 농도가 같다. 물은 양쪽으로 비슷하게 오간다.
@질문 파란 점 하나만 골라서 눈으로 따라가 보세요. 그 점이 막을 지나가나요?
@예상 지나가요 / 왔다 갔다 해요
@대기 6초 점 하나를 눈으로 따라가게 한다
지나가죠. 왼쪽에서 오른쪽으로 갔다가 또 돌아오기도 하고요. 물 입자는 가만히 있지 않아요. 쉬지 않고 움직이면서 막에 부딪히고, 부딪힌 김에 막을 지나가기도 해요.
지금은 양쪽 조건이 같으니까 오른쪽으로 넘어가는 물이나 왼쪽으로 넘어가는 물이나 비슷해요. 그래서 아래 숫자, 물 입자 수 차이가 영 근처에서 왔다 갔다 하죠.
@연출 슬라이더에 손을 올린 채 멈추고 학생들을 둘러본다.
이제 오른쪽에만 설탕을 넣을 거예요. 설탕은 막을 못 지나가요. 오른쪽에 갇혀 있게 돼요.
@질문 설탕을 넣고 나면 물은 어느 쪽으로 더 많이 갈까요? 왼쪽, 오른쪽, 아니면 그대로? U자관 수면은 어느 쪽이 올라갈까요?
@예상 설탕이 있는 오른쪽으로 / 물이 많은 왼쪽으로 / 그대로예요
@대기 15초 예측을 공책에 화살표 하나로 그리게 한다
@조작 설탕 입자 슬라이더를 0에서 30까지 한 칸씩 밀어 올린다. 값이 바뀔 때마다 입자 상자가 처음부터 다시 놓인다.
@대기 8초 입자 상자와 아래 숫자, U자관 수면을 함께 지켜보게 한다
@질문 아래 숫자를 보세요. 물 입자 수 차이, 오른쪽 빼기 왼쪽이에요. 영 근처에 있던 숫자가 어떻게 됐죠?
@예상 커졌어요 / 오른쪽 물이 더 많아졌어요
커졌죠. 오른쪽 물 입자가 왼쪽보다 그만큼 많아졌다는 뜻이에요. U자관도 보세요. 오른쪽 수면이 올라갔어요. 화면 문장도 바뀌었어요. 설탕물 쪽으로 옮겨 간 물이 더 많다. 오른쪽 수면이 올라간다.
예측에서 오른쪽으로 화살표를 그린 사람, 정의를 정확하게 쓴 거예요. 설탕이 있는 쪽이 용질 농도가 높은 쪽이니까요.
@연출 목소리를 바꿔 학생 흉내를 낸다.
"선생님, 그럼 이제 물은 오른쪽으로만 가는 거예요?"
@연출 원래 목소리로 돌아와 상자의 막 근처를 손가락으로 짚는다.
좋은 질문이에요. 상자에서 오른쪽에서 왼쪽으로 넘어가는 파란 점을 찾아보세요.
@대기 6초 왼쪽으로 넘어가는 물 입자를 찾게 한다
있죠? 물은 지금도 양쪽으로 다 움직여요. 오른쪽에서 왼쪽으로 넘어가는 물도 분명히 있어요. 다만 왼쪽에서 오른쪽으로 넘어가는 물이 더 많아요. 넘어간 양에서 넘어온 양을 빼고 남는 것을 **알짜**라고 해요. 물이 알짜로 오른쪽으로 옮겨 간 거예요.

그래도 규칙은 그대로 가져가세요. 물이 들어올수록 흡수력은 작아진다. 흡수력이 바깥 용액의 삼투압과 같아지면 부피가 더 변하지 않는다.

## tubes · 소금물 속 적혈구와 식물 세포
