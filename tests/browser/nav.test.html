<!doctype html>
<html lang="ko" data-deck="test-nav">
<head>
<meta charset="utf-8">
<title>nav</title>
<link rel="stylesheet" href="../../engine/exploragram.css">
<script defer src="../../engine/exploragram.js"></script>
<script src="harness.js"></script>
</head>
<body>
<section class="slide" id="s1" data-sec="1장" data-title="처음">
  <h2>질문</h2>
  <p class="step" id="a1">답 1</p>
  <p class="step" data-step="5" id="a2">답 2</p>
  <input id="field" value="">
</section>
<section class="slide" id="s2" data-title="둘째"><h2>둘째</h2></section>
<section class="slide" id="s3" data-title="셋째"><h2>셋째</h2><p class="step" id="c1">마지막</p></section>
<pre id="results" data-summary="pending"></pre>
<script>
const key = (k, target) => (target || document).dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
const shown = (id) => document.getElementById(id).classList.contains('is-shown');
const active = () => Exploragram._internal.Nav.state.slide;

test('처음에는 1쪽, 단계는 숨김', () => {
  eq(active(), 0);
  assert(!shown('a1') && !shown('a2'), 'steps hidden');
  assert(document.getElementById('s1').classList.contains('is-active'), 's1 active');
});
test('무대가 확대·축소되고 쪽 번호와 열쇠가 붙는다', () => {
  const { Stage } = Exploragram._internal;
  assert(Stage.scale > 0, 'scale');
  assert(Stage.deck.style.transform.includes('scale('), 'transform');
  eq(document.getElementById('s2').dataset.page, '2 / 3');
  eq(document.getElementById('s2').dataset.key, 's2');
  eq(document.body.dataset.tool, 'hand');
});
test('→ 키는 단계를 하나씩 열고 다 열리면 다음 장', () => {
  key('ArrowRight'); assert(shown('a1') && !shown('a2'), 'first step');
  key('ArrowRight'); assert(shown('a2'), 'second step');
  key('ArrowRight'); eq(active(), 1); eq(location.hash, '#2');
});
test('← 키는 이전 장을 단계 펼친 채로 보여 준다', () => {
  key('ArrowLeft'); eq(active(), 0); assert(shown('a1') && shown('a2'), 'all shown');
  key('ArrowLeft'); assert(!shown('a2'), 'last step hidden');
});
test('숫자 + Enter로 쪽 이동', () => { key('3'); key('Enter'); eq(active(), 2); });
test('onShow 훅이 불린다', () => {
  let got = -1;
  Exploragram.onShow((el, i) => { got = i; });
  Exploragram.go(1);
  eq(got, 1);
});
test('입력칸에서 친 글쇠는 넘기지 않는다', () => {
  const f = document.getElementById('field');
  Exploragram.go(0);
  f.value = '물';
  for (const k of ['ArrowRight', 'ArrowLeft', ' ', 'Enter', 'Backspace']) key(k, f);
  eq(active(), 0);
  assert(!shown('a1'), '글이 있는 칸의 화살표·Space·Enter·Backspace는 글쓰기');
  f.value = '';
  for (const k of [' ', 'Enter', 'Backspace']) key(k, f);
  assert(!shown('a1'), '빈 칸이어도 Space·Enter·Backspace는 글쓰기');
});
test('입력칸에 포커스가 있어도 리모컨(PageDown·PageUp)은 넘기고 칸을 놓는다', () => {
  const f = document.getElementById('field');
  Exploragram.go(0);
  f.value = '물';
  f.focus();
  key('PageDown', f);
  assert(shown('a1'), 'PageDown은 다음 단계');
  assert(document.activeElement !== f, '칸을 놓는다');
  f.focus();
  key('PageUp', f);
  assert(!shown('a1'), 'PageUp은 이전 단계');
  eq(f.value, '물', '적은 글은 그대로');
});
test('빈 입력칸의 화살표는 넘기고, Esc는 칸만 놓는다', () => {
  const f = document.getElementById('field');
  Exploragram.go(0);
  f.value = '';
  f.focus();
  key('ArrowRight', f);
  assert(shown('a1') && !shown('a2'), '빈 칸의 → 는 다음 단계');
  f.value = '물';
  f.focus();
  key('Escape', f);
  assert(document.activeElement !== f, 'Esc는 칸을 놓는다');
  assert(!shown('a2'), 'Esc는 넘기지 않는다');
  key('ArrowRight');
  assert(shown('a2'), '칸을 놓은 뒤 → 는 넘기기');
  f.value = '';
});
test('장을 떠나면 그 장 입력칸의 포커스를 놓는다', () => {
  const f = document.getElementById('field');
  Exploragram.go(0);
  f.focus();
  Exploragram.go(1);
  assert(document.activeElement !== f, '숨은 장의 칸에 포커스가 남지 않는다');
});
test('장 밖 입력칸(엔진 창)에서는 PageDown도 넘기지 않는다', () => {
  const f = document.body.appendChild(document.createElement('input'));
  Exploragram.go(1);
  f.focus();
  key('PageDown', f);
  eq(active(), 1);
  f.remove();
});
test('Home · End', () => { key('End'); eq(active(), 2); key('Home'); eq(active(), 0); });
test('처리하지 않은 키는 key 이벤트로 넘긴다', () => {
  let got = '';
  Exploragram._internal.on('key', (e) => { got = e.key; });
  key('q');
  eq(got, 'q');
});
test('Space·PageDown·↓·Enter는 다음, ↑·PageUp·Backspace는 이전', () => {
  for (const k of [' ', 'PageDown', 'ArrowDown', 'Enter']) { Exploragram.go(1); key(k); eq(active(), 2, k); }
  for (const k of ['ArrowUp', 'PageUp', 'Backspace']) { Exploragram.go(1); key(k); eq(active(), 0, k); }
});
test('Ctrl 조합은 넘기지 않고 key 이벤트로만 넘긴다', () => {
  Exploragram.go(1);
  let got = '';
  Exploragram._internal.on('key', (e) => { if (e.ctrlKey) got = e.key; });
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', ctrlKey: true, bubbles: true, cancelable: true }));
  eq(active(), 1);
  eq(got, 'ArrowRight');
});
test('override가 있으면 넘기기를 맡기고, go는 먼저 닫는다', () => {
  const { Nav } = Exploragram._internal;
  const calls = [];
  Exploragram.go(1);
  Nav.override = { next: () => calls.push('next'), prev: () => calls.push('prev'), close: () => { calls.push('close'); Nav.override = null; } };
  key('ArrowRight');
  key('ArrowLeft');
  eq(active(), 1);
  Exploragram.go(2);
  eq(calls, ['next', 'prev', 'close']);
  eq(active(), 2);
  eq(Nav.override, null);
});
test('hide 이벤트는 떠나는 장을 알려 준다', () => {
  Exploragram.go(0);
  let left = -1;
  Exploragram.onHide((el, i) => { left = i; });
  Exploragram.go(2);
  eq(left, 0);
});
test('toStage: 무대 가운데는 (640, 360)', () => {
  const { Stage } = Exploragram._internal;
  const r = Stage.deck.getBoundingClientRect();
  const [x, y] = Stage.toStage(r.left + r.width / 2, r.top + r.height / 2);
  eq([Math.round(x), Math.round(y)], [640, 360]);
});
test('scale은 창 안에 들어가는 가장 큰 배율', () => {
  const { Stage } = Exploragram._internal;
  const v = Stage.viewport;
  eq(Stage.scale.toFixed(4), Math.min(v.clientWidth / 1280, v.clientHeight / 720).toFixed(4));
});
test('진행 막대는 transform으로 차오른다', () => {
  Exploragram.go(2);
  eq(document.querySelector('.ch-progress > i').style.transform, 'scaleX(1)');
});
test('손 모드에서 손가락으로 왼쪽으로 밀면 다음 장', () => {
  Exploragram.go(1);
  const d = Exploragram._internal.Stage.deck;
  const p = (type, x) => d.dispatchEvent(new PointerEvent(type, { bubbles: true, pointerId: 5, pointerType: 'touch', isPrimary: true, clientX: x, clientY: 300 }));
  p('pointerdown', 600);
  p('pointerup', 480);
  eq(active(), 2);
});
test('숫자가 아닌 쪽 번호는 무시하고, 소수는 반올림', () => {
  Exploragram.go(1);
  Exploragram.go('abc');
  Exploragram.go(NaN);
  Exploragram.go(undefined);
  eq(active(), 1);
  Exploragram.go(1.6);
  eq(active(), 2);
});
test('쪽 번호를 치다가 다른 키를 누르면 번호는 버린다', () => {
  Exploragram.go(0);
  key('3');
  key('ArrowRight');
  key('Enter');
  eq(active(), 0);
});
</script>
</body>
</html>
