<!doctype html>
<html lang="ko" data-deck="test-settings">
<head>
<meta charset="utf-8">
<title>settings</title>
<link rel="stylesheet" href="../../engine/exploragram.css">
<script defer src="../../engine/exploragram.js"></script>
<script src="harness.js"></script>
</head>
<body>
<section class="slide" id="k1">
  <p id="kw">경로를 바꾸는 <mark>필요한 일</mark>이다</p>
  <p id="inline">이<em>것</em>은 <em><b>필요</b></em><strong>한</strong> 일이다</p>
  <p id="space">이 <mark>것</mark> 은 <em>필요</em> <strong>한</strong> 일이다</p>
  <p id="break">앞<br>뒤</p>
  <div id="blocks"><p>앞</p><p>뒤</p></div>
  <button id="kwb" type="button">눌러 보기</button>
  <div id="skip">
    <pre>보존할 코드</pre><code>보존할 코드</code><textarea>보존할 입력</textarea>
    <select><option>보존할 선택</option></select><span data-no-keep><b>그대로 유지</b></span>
    <span class="katex">수식 보존</span><svg><text>SVG 보존</text></svg><math><mtext>수식 보존</mtext></math>
  </div>
  <p class="step">단계</p>
</section>
<pre id="results" data-summary="pending"></pre>
<script>
const I = () => Exploragram._internal;
const btn = (name) => document.querySelector(`.ch-toolbar [data-name="${name}"]`);
const sw = (k) => document.querySelector(`.ch-pop input[data-key="${k}"]`);
const clean = (text) => text.replace(/\u2060/g, '');

test('기본 설정: 기능은 모두 켜져 있고, 그 밖에는 손등 지우기만 켜져 있다', () => {
  eq(I().Settings.values, { ink: true, board: true, live: true, liveInk: true, motionOff: false, timerSound: true, printInk: false, palmErase: true, palmSize: 0 });
});
test('⚙ 설정 버튼과 이름이 있는 스위치 여덟 개(기능 넷, 화면과 소리 둘, 판서 둘)', () => {
  btn('gear').click();
  eq(document.querySelectorAll('.ch-pop .ch-switch').length, 8);
  eq([...document.querySelectorAll('.ch-pop .ch-set-group h4')].map((x) => x.textContent), ['기능 켜고 끄기', '화면과 소리', '판서']);
  for (const input of document.querySelectorAll('.ch-pop .ch-switch input')) {
    assert(input.closest('label').textContent.trim(), 'accessible label');
    eq(input.checked, ['ink', 'board', 'live', 'liveInk', 'timerSound', 'palmErase'].includes(input.dataset.key), input.dataset.key);
  }
});
test('움직임 끄기는 바로 적용되고 저장된다', async () => {
  sw('motionOff').click();
  assert(document.documentElement.classList.contains('ch-motion-off'), 'class on');
  await wait(100);
  eq((await I().Store.get('settings')).motionOff, true);
});
test('움직임 끄기면 단계·슬라이드 전환 시간이 0', () => {
  const step = document.querySelector('.step');
  assert(getComputedStyle(step).transitionDuration.split(',').every((t) => parseFloat(t) === 0), 'no transition');
  eq(getComputedStyle(document.querySelector('.slide')).animationName, 'none');
});
test('손등 지우기 스위치는 판서층에 전달', async () => {
  sw('palmErase').click();
  eq(I().Ink.palmErase, false);
  await wait(100);
  eq((await I().Store.get('settings')).palmErase, false);
  sw('palmErase').click();
  eq(I().Ink.palmErase, true);
  await wait(100);
  eq((await I().Store.get('settings')).palmErase, true);
});
test('인쇄에 판서 포함 설정도 저장된다', async () => {
  sw('printInk').click();
  await wait(100);
  eq((await I().Store.get('settings')).printInk, true);
});
test('설정 재초기화는 저장값을 적용하고 버튼을 중복 생성하지 않는다', async () => {
  I().Settings.values = { ink: true, board: true, live: true, liveInk: true, motionOff: false, timerSound: true, printInk: false, palmErase: false, palmSize: 0 };
  I().Settings.apply();
  await I().Settings.init();
  eq(I().Settings.values, { ink: true, board: true, live: true, liveInk: true, motionOff: true, timerSound: true, printInk: true, palmErase: true, palmSize: 0 });
  eq(I().Ink.palmErase, true);
  assert(document.documentElement.classList.contains('ch-motion-off'), 'restored');
  eq(document.querySelectorAll('.ch-toolbar [data-name="gear"]').length, 1);
});
test('알 수 없는 설정 키는 저장되지 않는다', async () => {
  const old = await I().Store.get('settings');
  await I().Settings.set('unknown', true);
  await I().Settings.set('__proto__', true);
  eq(await I().Store.get('settings'), old);
  eq(Object.keys(I().Settings.values), ['ink', 'board', 'live', 'liveInk', 'motionOff', 'timerSound', 'printInk', 'palmErase', 'palmSize']);
});
test('설정을 끄면 효과와 입력 UI가 함께 복원된다', async () => {
  await I().Settings.set('motionOff', false);
  await I().Settings.set('palmErase', false);
  eq(document.documentElement.classList.contains('ch-motion-off'), false);
  eq(I().Ink.palmErase, false);
  eq(sw('motionOff').checked, false);
  eq(sw('palmErase').checked, false);
  assert(getComputedStyle(document.querySelector('.step')).transitionDuration.split(',').some((t) => parseFloat(t) > 0), 'transition restored');
});
const shown = (el) => !!el && el.getClientRects().length > 0;   // 부모가 숨겨져도 잡힌다
const small = (k) => sw(k).closest('.ch-switch').querySelector('small').textContent;
const gear = () => { if (!document.querySelector('.ch-pop-settings')) btn('gear').click(); };
test('판서를 끄면 판서 도구·칠판·양옆 도구가 사라지고 손 도구만 남는다', async () => {
  gear();
  I().Tools.set('pen');
  sw('ink').click();
  eq(I().Settings.values.ink, false);
  assert(document.documentElement.classList.contains('ch-off-ink'), 'class');
  for (const n of ['hand', 'pen', 'hl', 'eraser', 'laser', 'style', 'undo', 'clear', 'class', 'slides', 'board']) assert(!shown(btn(n)), `${n} 숨김`);
  for (const hud of document.querySelectorAll('.ch-hud')) assert(!shown(hud), '양옆 도구 숨김');
  assert(!shown(document.querySelector('.ch-ink')), '판서층 숨김');
  eq(I().Tools.current, 'hand', '쓰던 펜은 손으로');
  I().Tools.set('pen');
  eq(I().Tools.current, 'hand', '펜을 고를 수 없다');
  document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', code: 'KeyP', bubbles: true }));
  eq(I().Tools.current, 'hand', '단축키 p도 안 된다');
  I().Board.open();
  eq(I().Board.active, false, '칠판도 열리지 않는다');
  for (const n of ['edit', 'next', 'toc', 'gear']) assert(shown(btn(n)), `${n}은 그대로`);
  eq(sw('board').disabled, true, '판서에 기대는 칠판 스위치는 잠긴다');
  eq(sw('board').checked, false);
  eq(small('board'), '판서를 켜야 쓸 수 있습니다');
  eq(small('liveInk'), '판서를 켜야 쓸 수 있습니다');
  assert(document.querySelector('.ch-pop .ch-set-group[data-need="ink"]').hidden, '판서 설정 묶음은 숨긴다');
  await wait(100);
  eq((await I().Store.get('settings')).ink, false);
});
test('판서를 다시 켜면 도구가 돌아오고 칠판 스위치는 저장값대로', () => {
  sw('ink').click();
  eq(sw('board').disabled, false);
  eq(sw('board').checked, true);
  eq(small('board'), '슬라이드 대신 빈 칠판을 열어 씁니다');
  for (const n of ['pen', 'undo', 'board']) assert(shown(btn(n)), `${n} 보임`);
  assert(!document.querySelector('.ch-pop .ch-set-group[data-need="ink"]').hidden, '판서 설정 묶음');
  I().Tools.set('pen');
  eq(I().Tools.current, 'pen');
  I().Tools.set('hand');
});
test('칠판만 끄면 슬라이드·칠판 전환이 사라지고, 열려 있던 칠판은 닫힌다', () => {
  I().Board.open();
  eq(I().Board.active, true);
  gear();
  sw('board').click();
  eq(I().Board.active, false, '칠판을 닫는다');
  gear();   // 칠판을 닫으면 떠 있던 창도 닫힌다
  assert(!shown(btn('board')) && !shown(btn('slides')), '전환 단추 숨김');
  for (const seg of document.querySelectorAll('.ch-hud .ch-seg')) assert(!shown(seg), '양옆 도구의 전환도 숨김');
  document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'c', code: 'KeyC', bubbles: true }));
  eq(I().Board.active, false, '단축키 c도 안 된다');
  assert(shown(btn('pen')), '판서는 그대로');
  sw('board').click();
  assert(shown(btn('board')), '다시 켜면 돌아온다');
});
test('실시간 수업을 끄면 「실시간」 단추가 사라지고, 학생 화면 판서 스위치는 이유와 함께 잠긴다', () => {
  gear();
  sw('live').click();
  assert(!shown(btn('live')), '실시간 단추 숨김');
  eq(sw('liveInk').disabled, true);
  eq(small('liveInk'), '실시간 수업을 켜야 쓸 수 있습니다');
  sw('ink').click();
  eq(small('liveInk'), '판서와 실시간 수업을 켜야 쓸 수 있습니다', '둘 다 꺼져 있으면 둘 다 말한다');
  sw('ink').click();
  sw('live').click();
  assert(shown(btn('live')), '다시 켜면 돌아온다');
  eq(sw('liveInk').disabled, false);
  eq(sw('liveInk').checked, true, '저장값은 그대로였다');
});
test('편집 기능은 스위치가 없고 늘 보인다', () => {
  assert(!document.querySelector('.ch-switch input[data-key="edit"]'));
  assert(shown(btn('edit')));
});
test('기능 설정은 재초기화해도 남는다(이 기기의 다른 수업 파일)', async () => {
  gear();
  sw('ink').click();
  await wait(100);
  I().Settings.values.ink = true;
  await I().Settings.init();
  eq(I().Settings.values.ink, false);
  assert(document.documentElement.classList.contains('ch-off-ink'), '다시 꺼진 모양');
  await I().Settings.set('ink', true);
  assert(!document.documentElement.classList.contains('ch-off-ink'));
});
test('설정 창은 작은 화면에서 넘치면 안에서 스크롤된다', () => {
  gear();
  const pop = document.querySelector('.ch-pop-settings');
  eq(getComputedStyle(pop).overflowY, 'auto');
  assert(pop.getBoundingClientRect().bottom <= innerHeight, `창 안: ${pop.getBoundingClientRect().bottom} / ${innerHeight}`);
});
test('손상된 저장값은 설정을 켜지 않으며 모르는 키는 무시한다', async () => {
  await I().Settings.set('printInk', false);
  await I().Store.set('settings', { motionOff: 'false', printInk: null, palmErase: 1, palmSize: 'x', unknown: true });
  await I().Settings.init();
  eq(I().Settings.values, { ink: true, board: true, live: true, liveInk: true, motionOff: false, timerSound: true, printInk: false, palmErase: false, palmSize: 0 });
  eq(I().Ink.palmErase, false);
  eq(document.documentElement.classList.contains('ch-motion-off'), false);
});
test('손으로 맞추기: 손가락과 손등 크기의 가운데가 지우개 기준', async () => {
  const touch = (type, size) => document.querySelector('.ch-calib').dispatchEvent(new PointerEvent(type, {
    bubbles: true, cancelable: true, pointerType: 'touch', pointerId: 5, width: size, height: size, buttons: type === 'pointerup' ? 0 : 1,
  }));
  I().Settings.calibrate();
  touch('pointerdown', 10); touch('pointermove', 12); touch('pointerup', 12);
  touch('pointerdown', 20); touch('pointermove', 32); touch('pointerup', 32);
  await wait(100);
  eq(I().Settings.values.palmSize, 22);
  eq(I().Ink.palmSize, 22);
  eq(I().Ink.palmErase, true);
  document.querySelector('.ch-calib').remove();
  // 크기를 알려 주지 않는 칠판(늘 1)은 기준을 바꾸지 않고 그렇다고 알린다
  I().Settings.calibrate();
  touch('pointerdown', 1); touch('pointerup', 1);
  touch('pointerdown', 1); touch('pointerup', 1);
  eq(I().Settings.values.palmSize, 22);
  assert(document.querySelector('.ch-calib-msg').textContent.includes('구별'), 'no-size message');
  document.querySelector('.ch-calib').remove();
  await I().Settings.set('palmSize', 0);
});
test('어절 보정: 어절은 span.w, 요소 경계에는 WORD JOINER', () => {
  const p = document.getElementById('kw');
  assert(p.querySelectorAll('.w').length >= 4, 'wrapped');
  assert(p.querySelector('mark').nextSibling.textContent.startsWith('\u2060'), 'word joiner after mark');
  eq(clean(p.textContent), '경로를 바꾸는 필요한 일이다');
  eq(getComputedStyle(p.querySelector('.w')).whiteSpace, 'nowrap');
});
test('연속 인라인 요소와 중첩된 경계도 어절을 잇는다', () => {
  const p = document.getElementById('inline');
  const em = p.querySelectorAll('em');
  assert(em[1].textContent.endsWith('\u2060') || em[1].nextSibling.textContent.startsWith('\u2060'), 'adjacent inline boundary');
  assert(p.firstChild.textContent.endsWith('\u2060'), 'boundary before inline');
  eq(clean(p.textContent), '이것은 필요한 일이다');
});
test('공백·줄바꿈·블록 경계에는 WORD JOINER를 넣지 않는다', () => {
  for (const id of ['space', 'break', 'blocks']) assert(!document.getElementById(id).textContent.includes('\u2060'), id);
});
test('버튼·입력·코드·수식·data-no-keep 내부는 감싸지 않는다', () => {
  eq(document.getElementById('kwb').children.length, 0);
  eq(document.getElementById('skip').querySelectorAll('.w').length, 0);
  eq(document.querySelector('#skip textarea').value, '보존할 입력');
});
test('어절 보정을 다시 적용해도 DOM·텍스트·span 수가 변하지 않는다', () => {
  const root = I().Stage.deck;
  const before = root.cloneNode(true);
  I().KeepWords.apply(root);
  I().KeepWords.apply(root);
  assert(root.isEqualNode(before), 'idempotent DOM');
  eq(root.querySelectorAll('.w .w').length, 0);
});
test('어절 보정은 요소·이벤트·공백 텍스트를 보존한다', () => {
  const p = document.createElement('p');
  p.append('앞  ');
  const a = document.createElement('a');
  a.textContent = '연결';
  let clicked = 0;
  a.addEventListener('click', () => clicked++);
  p.append(a, '\n\t끝');
  I().KeepWords.apply(p);
  eq(clean(p.textContent), '앞  연결\n\t끝');
  assert(p.querySelector('a') === a, 'original element retained');
  a.click();
  eq(clicked, 1);
});
test('새로 추가한 텍스트만 어절 보정하고 기존 어절은 보존한다', () => {
  const p = document.createElement('p');
  p.textContent = '원래 어절';
  I().KeepWords.apply(p);
  const first = p.firstChild;
  p.append(' 새 어절');
  I().KeepWords.apply(p);
  assert(p.firstChild === first, 'original wrapper retained');
  eq(p.querySelectorAll('.w').length, 4);
  eq(clean(p.textContent), '원래 어절 새 어절');
});
</script>
</body>
</html>
