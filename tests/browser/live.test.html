<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>live</title>
<!-- 부모 페이지에는 엔진이 없다. 교사 하나와 학생 둘을 iframe으로 띄우고 로컬 전송(BroadcastChannel)으로 잇는다. -->
<script>window.Exploragram = { ready: Promise.resolve() };</script>
<script src="harness.js"></script>
<style>iframe { width: 640px; height: 360px; border: 1px solid #ccc; }</style>
</head>
<body>
<pre id="results"></pre>
<script>
const frames = {};
let T, A, B;

function frame(name, src) {
  return new Promise((resolve) => {
    const f = document.createElement('iframe');
    f.src = src;
    f.onload = () => resolve(f);
    document.body.append(f);
    frames[name] = f;
  });
}

async function until(fn, ms) {
  const t0 = Date.now();
  let last = '';
  while (Date.now() - t0 < (ms || 4000)) {
    try { if (fn()) return; } catch (err) { last = err.message; }   // 아직 준비 안 됨
    await wait(50);
  }
  throw new Error(`시간 초과: ${fn}${last ? ` (${last})` : ''}`);
}

async function open(name, query) {
  const f = await frame(name, `live-deck.html?live=local${query || ''}`);
  await until(() => f.contentWindow.Exploragram && f.contentWindow.Exploragram.ready);
  await f.contentWindow.Exploragram.ready;
  return f.contentWindow.Exploragram._internal;
}

const doc = (name) => frames[name].contentDocument;
const shown = (name, id) => doc(name).getElementById(id).classList.contains('is-shown');
const bar = (name) => doc(name).querySelector('.ch-live-bar');
const visible = (el) => !!el && !el.hidden && getComputedStyle(el).display !== 'none';

test('교사가 실시간을 켜면 6자리 코드가 생긴다(로컬 전송)', async () => {
  T = await open('t');
  assert(T.Live.local, '설정이 없으면 로컬 전송');
  assert(doc('t').querySelector('.ch-tb-btn[data-name="live"]'), '툴바에 「실시간」');
  T.Live.startTeacher();
  await until(() => /^\d{6}$/.test(T.Live.code), 5000);
});

test('실시간 창의 QR을 누르면 화면 가득 크게 뜨고, 아무 데나 누르거나 Esc로 닫는다', async () => {
  // file:// 시험이라 QR을 그리지 않는다. QR 라이브러리를 흉내 내고 웹 주소인 셈 치고 그린다.
  frames.t.contentWindow.qrcode = () => ({ addData() {}, make() {}, createDataURL: () => 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==' });
  await T.Live.drawQr(`https://example.com/lesson.html?join=${T.Live.code}`);
  const qr = doc('t').querySelector('.ch-live-qr');
  assert(visible(qr) && qr.matches('button') && qr.querySelector('img'), '작은 QR은 누를 수 있다');
  const big = () => doc('t').querySelector('.ch-live-big');
  qr.click();
  assert(visible(big()), '크게 뜬다');
  eq(big().querySelector('.ch-live-code').textContent, `${T.Live.code.slice(0, 3)} ${T.Live.code.slice(3)}`, '코드도 크게');
  const r = big().querySelector('img').getBoundingClientRect();
  assert(r.width >= 360 * 0.6 && r.width === r.height, `QR 크기 ${r.width}×${r.height}`);
  const p = big().getBoundingClientRect();
  eq([p.width, p.height], [640, 360], '화면 가득');
  big().click();
  assert(!visible(big()), '누르면 닫힌다');
  qr.click();
  doc('t').body.dispatchEvent(new frames.t.contentWindow.KeyboardEvent('keydown', { key: 'Escape', code: 'Escape', bubbles: true }));
  assert(!visible(big()), 'Esc로 닫는다');
  T.Live.renderPanel();   // 흉내 낸 QR을 걷는다
});

test('학생 둘이 코드로 들어와 교사 장을 따라간다', async () => {
  A = await open('a', `&join=${T.Live.code}`);
  B = await open('b', `&join=${T.Live.code}`);
  await until(() => A.Live.teacher && B.Live.teacher);
  assert(!visible(doc('a').querySelector('.ch-live-join')), '입장 화면이 닫힌다');
  eq(A.Nav.state.slide, 0);
  assert(doc('a').documentElement.classList.contains('ch-live-student'), '학생 모드');
  eq(getComputedStyle(doc('a').querySelector('.ch-toolbar')).display, 'none', '학생은 툴바가 없다');
});

test('교사가 넘기면 장과 단계를 따라가고, 열지 않은 답은 가린다', async () => {
  T.Nav.next();
  T.Nav.next();
  await until(() => A.Nav.state.slide === 1 && A.Nav.state.shown === 1);
  assert(shown('a', 's2a'), '연 단계는 보임');
  assert(!shown('a', 's2b'), '열지 않은 단계는 가림');
  A.Nav.go(3);
  await wait(100);
  eq(A.Nav.state.slide, 1, '차례 단추·Exploragram.go로도 교사가 안 연 장에는 못 간다');
});

test('단계 막대도 따라가고, 학생도 막대를 직접 움직일 수 있다', async () => {
  T.Nav.go(2);
  T.Nav.next();
  eq(T.Stepper.bySlide[2][0].pos, 1, '교사 막대 한 칸');
  await until(() => A.Nav.state.slide === 2 && A.Stepper.bySlide[2][0].pos === 1);
  assert(!A.Stepper.bySlide[2][0].input.disabled, '학생 막대는 잠기지 않는다');
});

test('교사가 점검(D)을 돌려도 단계 막대를 다 연 상태가 학생에게 가지 않는다', async () => {
  T.Audit.run();
  await wait(700);
  eq(T.Stepper.bySlide[2][0].pos, 1, '점검 뒤 교사 막대는 제자리');
  eq(T.Live.reach[2].steps[0], 1, '연 범위에 남지 않는다');
  eq(A.Stepper.bySlide[2][0].pos, 1, '학생 막대도 그대로');
});

test('학생이 움직인 막대는 교사가 막대를 옮길 때까지 그대로 둔다', async () => {
  const a = A.Stepper.bySlide[2][0];
  const b = B.Stepper.bySlide[2][0];
  a.input.value = '2';
  a.input.dispatchEvent(new Event('input', { bubbles: true }));
  eq(a.pos, 2, '학생이 「나」까지 열었다');
  eq(T.Stepper.bySlide[2][0].pos, 1, '교사 막대는 그대로');
  T.Live.sendState();
  await wait(300);
  eq(a.pos, 2, '교사 소식이 그대로 오면 학생이 고른 칸을 둔다');
  eq(b.pos, 1, '다른 학생은 교사 칸');
  T.Stepper.bySlide[2][0].set(0, 'input');
  await until(() => a.pos === 0 && b.pos === 0);
  T.Stepper.bySlide[2][0].set(1, 'input');
  await until(() => a.pos === 1 && b.pos === 1);
});

test('학생은 지난 장으로 갈 수 있고, 교사가 연 만큼만 보인다', async () => {
  A.Nav.prev();
  await until(() => A.Nav.state.slide === 1);
  eq(A.Nav.state.shown, 1, '교사가 연 단계까지만');
  assert(!shown('a', 's2b'), '지난 장에서도 열지 않은 답은 가림');
  assert(visible(bar('a')), '띠가 보인다');
  assert(bar('a').textContent.includes('3장'), `띠 글: ${bar('a').textContent}`);
});

test('교사가 넘겨도 지난 장을 보는 학생은 머물고, 따라가는 학생은 간다', async () => {
  T.Nav.next();
  T.Nav.next();
  eq(T.Nav.state.slide, 3, '교사 4장');
  await until(() => B.Nav.state.slide === 3);
  await wait(200);
  eq(A.Nav.state.slide, 1, '지난 장에 머문다');
  assert(bar('a').textContent.includes('4장'), `띠 글: ${bar('a').textContent}`);
});

test('「선생님 화면으로」를 누르면 교사 장으로, 교사보다 앞으로는 못 간다', async () => {
  bar('a').querySelector('button').click();
  await until(() => A.Nav.state.slide === 3);
  assert(!visible(bar('a')), '따라가면 띠가 사라진다');
  A.Nav.next();
  await wait(100);
  eq(A.Nav.state.slide, 3, '앞으로 못 간다');
});

test('지난 장의 단계 막대는 교사가 연 가장 먼 칸까지', async () => {
  A.Nav.prev();
  await until(() => A.Nav.state.slide === 2);
  eq(A.Stepper.bySlide[2][0].pos, 2, '교사가 「나」까지 열었다');
  bar('a').querySelector('button').click();
  await until(() => A.Nav.state.slide === 3);
});

// 학생 iframe 안 슬라이더를 손으로 움직인 것처럼
function slide(name, id, v) {
  const el = doc(name).getElementById(id);
  el.value = String(v);
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.dispatchEvent(new Event('change', { bubbles: true }));
}

test('학생 값이 교사에게 모이고 참여 인원이 보인다', async () => {
  slide('a', 't', 3);
  slide('b', 't', 7);
  await until(() => (T.Live.vals.get('3|t') || new Map()).size === 2);
  T.Live.renderCount();
  assert(doc('t').querySelector('.ch-live-count').textContent.includes('2명'), doc('t').querySelector('.ch-live-count').textContent);
});

test('「학생 보기」 분포, 막대를 누르면 칠판 익스플로라그램에 띄우고 「내 값으로」 되돌린다', async () => {
  doc('t').querySelector('.ch-live-dist-btn').click();
  await until(() => doc('t').querySelectorAll('.ch-live-dist .ch-live-row').length === 1);
  const bins = doc('t').querySelectorAll('.ch-live-dist .ch-live-bin');
  eq(bins.length, 11, '0~10 값마다 한 칸');
  assert(!bins[3].disabled && !bins[7].disabled && bins[5].disabled, '학생 값이 있는 칸만 누를 수 있다');
  bins[3].click();
  eq(doc('t').getElementById('t').value, '3');
  eq(doc('t').getElementById('t-out').textContent, '3', '익스플로라그램이 다시 그린다');
  await until(() => doc('t').querySelector('.ch-live-back'));
  doc('t').querySelector('.ch-live-back').click();
  eq(doc('t').getElementById('t').value, '5', '내 값으로');
  eq(doc('t').getElementById('t-out').textContent, '5');
});

test('범위 밖 값은 슬라이더 끝으로 자르고, 모양이 틀린 값은 버린다', async () => {
  B.Live.inbox.send('val', { sid: B.Live.sid, slide: 3, key: 't', v: 99 });
  B.Live.inbox.send('val', { sid: 'zzzz9999', slide: 3, key: 'none', v: 1 });
  B.Live.inbox.send('val', { sid: 'BAD', slide: 3, key: 't', v: 1 });
  await until(() => T.Live.vals.get('3|t').get(B.Live.sid) === 10);
  eq(T.Live.vals.get('3|t').size, 2, '모르는 슬라이더·틀린 sid는 모으지 않는다');
});

test('학생용 파일에는 학생 표시만 붙고 엔진 흔적은 없다', () => {
  const html = T.Live.studentHtml();
  assert(html.includes('data-live="student"'), '학생 표시');
  assert(!html.includes('ch-toolbar') && !html.includes('ch-live-ui'), '툴바·실시간 창은 들어가지 않는다');
  assert(html.includes('https://cdn.jsdelivr.net/gh/N-lifescience/resonance@2/engine/exploragram.js'), '상대 주소 엔진은 CDN으로');
  assert(!html.includes('../../engine/'), '상대 주소가 남지 않는다');
});

test('코드를 아는 다른 사람이 보낸 가짜 끝·상태는 무시한다', async () => {
  const bc = new BroadcastChannel(`ch-live-${T.Live.code}`);
  bc.postMessage({ event: 'end', payload: { tid: 'fake0000' } });
  bc.postMessage({ event: 'state', payload: Object.assign(T.Live.stateNow(), { tid: 'fake0000', slide: 0 }) });
  await wait(300);
  bc.close();
  assert(!visible(doc('a').querySelector('.ch-live-join')), '끝나지 않았다');
  eq(A.Nav.state.slide, 3, '가짜 상태로 장이 바뀌지 않았다');
});

test('퀴즈: 학생이 처음 고른 보기만 모이고, 「학생 보기」에 보기마다 인원과 정답 ✓', async () => {
  T.Nav.go(4);
  await until(() => A.Nav.state.slide === 4 && B.Nav.state.slide === 4);
  const opts = (n) => doc(n).querySelectorAll('#quiz .opt');
  opts('a')[1].click();   // 틀림
  opts('a')[0].click();   // 다시 골라 맞힘: 모으지 않는다
  opts('b')[0].click();
  await until(() => (T.Live.picks.get('4|q0') || new Map()).size === 2);
  eq(T.Live.picks.get('4|q0').get(A.Live.sid).join(), '1', '처음 고른 것');
  eq(T.Live.picks.get('4|q0').get(B.Live.sid).join(), '0');
  await until(() => (doc('t').querySelector('.ch-live-quiz .ch-live-n') || {}).textContent === '2명');
  const li = doc('t').querySelectorAll('.ch-live-quiz .ch-live-opts li');
  eq(li.length, 3);
  assert(li[0].classList.contains('is-ok') && li[0].textContent.includes('✓'), '정답 보기 표시');
  assert(li[0].textContent.includes('1명') && li[1].textContent.includes('1명') && li[2].textContent.includes('0명'), li[0].textContent);
  assert(doc('t').querySelector('.ch-live-quiz .ch-live-n').textContent.includes('2명'));
});

test('단답: 이름 없이 카드로 모이고, 교사가 숨긴 답은 고쳐 보내면 다시 보인다', async () => {
  T.Nav.go(5);
  await until(() => A.Nav.state.slide === 5 && B.Nav.state.slide === 5);
  const send = (n, t) => {
    doc(n).querySelector('#short .ch-short-in').value = t;
    doc(n).querySelector('#short .ch-short-send').click();
  };
  send('a', '');
  assert(doc('a').querySelector('#short .ch-fb').textContent.includes('먼저'), '빈 답은 안 보낸다');
  send('a', '  입자는\n스스로 움직인다  ');
  send('b', '<img src=x onerror=alert(1)>');
  await until(() => (T.Live.texts.get('5|s0') || new Map()).size === 2);
  eq(T.Live.texts.get('5|s0').get(A.Live.sid).t, '입자는 스스로 움직인다', '줄바꿈·앞뒤 빈칸 정리');
  assert(doc('a').querySelector('#short .ch-fb').textContent.includes('보냈어요'));
  await until(() => doc('t').querySelectorAll('.ch-live-cards li').length === 2);
  const cards = doc('t').querySelector('.ch-live-cards');
  assert(!cards.querySelector('img'), '받은 글은 글자로만 보인다');
  assert(cards.textContent.includes('<img'), cards.textContent);
  assert(!cards.textContent.includes(A.Live.sid), '학생 표시는 보이지 않는다');
  cards.querySelector('li:last-child .ch-live-x').click();
  await until(() => doc('t').querySelectorAll('.ch-live-cards li').length === 1);
  assert(doc('t').querySelector('.ch-live-short .ch-live-n').textContent.includes('숨김 1'));
  send('b', '확산');
  await until(() => doc('t').querySelectorAll('.ch-live-cards li').length === 2);
  B.Live.inbox.send('text', { sid: B.Live.sid, slide: 5, key: 'none', t: 'x' });
  B.Live.inbox.send('text', { sid: B.Live.sid, slide: 5, key: 's0', t: '   ' });
  await wait(300);
  eq(T.Live.texts.get('5|s0').get(B.Live.sid).t, '확산', '모르는 키·빈 글은 버린다');
  eq(T.Live.texts.size, 1);
});

test('투표: 학생이 고른 것(바꾸면 마지막 것)이 모이고, 「칠판에 넣기」로 칠판 투표에 들어간다', async () => {
  T.Nav.go(6);
  await until(() => A.Nav.state.slide === 6 && B.Nav.state.slide === 6);
  const opts = (n) => doc(n).querySelectorAll('#poll .ch-poll-opt');
  eq(getComputedStyle(doc('a').querySelector('#poll .ch-poll-minus')).display, 'none', '학생은 세지 않는다');
  eq(doc('a').querySelector('#poll .ch-poll-total').textContent, '하나를 골라요.');
  opts('a')[0].click();
  opts('a')[2].click();   // 바꿈
  opts('b')[2].click();
  const votes = () => T.Live.picks.get('6|poll') || new Map();   // 키는 상자 id
  await until(() => votes().size === 2 && votes().get(A.Live.sid).join() === '2');
  eq(votes().get(B.Live.sid).join(), '2');
  eq(doc('a').querySelector('#poll .ch-poll-total').textContent, '골랐어요. 바꿔도 돼요.');
  await until(() => (doc('t').querySelector('.ch-live-poll .ch-live-n') || {}).textContent === '2명');
  const li = () => doc('t').querySelectorAll('.ch-live-poll .ch-live-opts li');
  eq(li().length, 3);
  assert(li()[2].textContent.includes('2명') && li()[0].textContent.includes('0명'), li()[2].textContent);
  assert(!doc('t').querySelector('.ch-live-poll .is-ok'), '정답 표시 없음');
  eq(doc('t').querySelector('.ch-live-poll .ch-live-name').textContent, '교복을 없애는 데 찬성하나요?');
  const p = T.Poll.list[0];
  eq(p.n.join(), '0,0,0', '칠판에는 교사가 넣을 때까지 안 보인다');
  doc('t').querySelector('.ch-live-put').click();
  eq(p.n.join(), '0,0,2');
  eq(doc('t').querySelector('#poll .ch-poll-total').textContent, '모두 2명');
  // 한 학생 한 표: 여러 개를 보내면 앞의 하나만, 없는 보기 번호는 버린다
  B.Live.inbox.send('pick', { sid: B.Live.sid, slide: 6, key: 'poll', c: [1, 2] });
  await until(() => votes().get(B.Live.sid).join() === '1');
  A.Live.inbox.send('pick', { sid: A.Live.sid, slide: 6, key: 'poll', c: [7] });
  await until(() => votes().get(A.Live.sid).length === 0);
  await until(() => li()[1].textContent.includes('1명') && li()[2].textContent.includes('0명'));
  doc('t').querySelector('#poll .ch-poll-opt').click();   // 교사 화면에서는 손으로도 센다
  eq(p.n.join(), '1,0,2');
});

test('응답 현황: 응답을 받는 장에서만 교사 화면 오른쪽 위에 "접속 m명 중 n명 제출"', async () => {
  const chip = () => doc('t').querySelector('.ch-live-tally');
  T.Live.showPanel(false);
  T.Live.toggleDist(false);
  T.Live.seen.delete('zzzz9999');   // 앞 시험이 보낸 가짜 학생
  T.Nav.go(5);
  await until(() => chip() && !chip().hidden && chip().textContent === '접속 2명 모두 제출');
  assert(chip().classList.contains('is-all'), '모두 내면 초록');
  T.Live.texts.get('5|s0').delete(B.Live.sid);
  T.Live.renderCount();
  eq(chip().textContent, '접속 2명 중 1명 제출');
  assert(!chip().classList.contains('is-all'));
  T.Live.seen.set(A.Live.sid, Date.now() - 31000);   // A가 30초 넘게 소식이 없다: 접속에서도, 제출에서도 뺀다
  T.Live.renderCount();
  eq(chip().textContent, '접속 1명 중 0명 제출');
  T.Live.seen.set(A.Live.sid, Date.now());
  T.Nav.go(3);
  await until(() => chip().textContent === '접속 2명 모두 참여');   // 슬라이더만 있는 장
  T.Nav.go(0);
  await until(() => chip().hidden);   // 학생이 답하는 활동이 없는 장
  T.Nav.go(4);
  await until(() => !chip().hidden && chip().textContent === '접속 2명 모두 제출');
  T.Live.showPanel(true);
  assert(chip().hidden, '실시간 창이 열려 있으면 창 안에 같은 줄');
  eq(doc('t').querySelector('.ch-live-count').textContent, '접속 2명 모두 제출');
  T.Live.showPanel(false);
  assert(!chip().hidden);
  chip().click();
  assert(T.Live.distOn && !doc('t').querySelector('.ch-live-dist').hidden, '누르면 「학생 보기」');
  T.Live.toggleDist(false);
  // 툴바 타이머를 칩 자리로 옮기면 칩은 타이머 아래로 내려간다
  T.PopTimer.open(60);
  T.PopTimer.pos = { x: 9999, y: 0 };
  T.PopTimer.place();
  T.emit('pop-timer-moved');
  const p = doc('t').querySelector('.ch-ptimer').getBoundingClientRect();
  assert(chip().getBoundingClientRect().top >= p.bottom, `칩 ${chip().getBoundingClientRect().top} / 타이머 아래 ${p.bottom}`);
  T.PopTimer.close();
  T.PopTimer.pos = null;
  eq(chip().style.top, '', '타이머를 닫으면 제자리');
});

test('툴바 타이머: 실시간 수업 중이면 학생 화면에도 남은 시간이 보인다', async () => {
  const tm = (n) => doc(n).querySelector('.ch-live-timer');
  T.PopTimer.open(90);
  await until(() => tm('a') && !tm('a').hidden && /^1:(30|29|28)$/.test(tm('a').lastChild.textContent));
  eq(tm('a').firstChild.textContent, '남은 시간');
  assert(tm('b') && !tm('b').hidden, '학생 둘 다');
  doc('t').querySelector('.ch-ptimer .ch-timer-run').click();   // 멈춤
  await until(() => tm('a').firstChild.textContent === '멈춤');
  const at = tm('a').lastChild.textContent;
  await wait(1200);
  eq(tm('a').lastChild.textContent, at, '멈추면 학생 화면도 멈춘다');
  T.PopTimer.t.left = 0;   // 멈춘 채 남은 시간을 0으로
  T.Timer.render(T.PopTimer.t);
  T.PopTimer.changed();
  await until(() => tm('a').lastChild.textContent === '끝');
  doc('t').querySelector('.ch-ptimer .ch-ptimer-x').click();
  await until(() => tm('a').hidden && tm('b').hidden);
});

test('코드 없이 학생 역할이면 입장 화면에서 코드를 넣고 들어간다', async () => {
  const C = await open('c', '&join=');
  assert(visible(doc('c').querySelector('.ch-live-join')), '입장 화면');
  const input = doc('c').querySelector('.ch-live-join input');
  eq(input.value, '');
  input.value = '12';
  doc('c').querySelector('.ch-live-go').click();
  assert(doc('c').querySelector('.ch-live-msg').textContent.includes('6자리'), '코드 확인 글');
  input.value = T.Live.code;
  doc('c').querySelector('.ch-live-go').click();
  await until(() => C.Live.teacher && C.Nav.state.slide === T.Nav.state.slide);
  assert(!visible(doc('c').querySelector('.ch-live-join')));
});

test('교사가 끝내면 학생 화면에 "수업이 끝났어요"', async () => {
  T.Live.endTeacher();
  for (const n of ['a', 'b', 'c']) {
    await until(() => visible(doc(n).querySelector('.ch-live-join')) && doc(n).querySelector('.ch-live-join h2').textContent === '수업이 끝났어요');
  }
  eq(T.Live.role, null);
  eq(T.Live.vals.size, 0, '모은 값은 지운다');
});

test('끝난 뒤 「다른 코드로 들어가기」로 새 수업에 들어간다', async () => {
  const old = T.Live.code || '';
  T.Live.startTeacher();
  await until(() => /^\d{6}$/.test(T.Live.code) && T.Live.code !== old && T.Live.inbox, 5000);
  const btn = [...doc('a').querySelectorAll('.ch-live-join button')].find((b) => b.textContent.includes('다른 코드'));
  assert(btn, '다른 코드로 들어가기 단추');
  btn.click();
  const input = doc('a').querySelector('.ch-live-join input');
  assert(input && input.value === '', '빈 입력칸');
  input.value = T.Live.code;
  doc('a').querySelector('.ch-live-go').click();
  await until(() => A.Live.teacher && !visible(doc('a').querySelector('.ch-live-join')));
  await until(() => T.Live.count() === 1);
});
</script>
