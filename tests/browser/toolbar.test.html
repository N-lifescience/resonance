<!doctype html>
<html lang="ko" data-deck="test-toolbar">
<head>
<meta charset="utf-8">
<title>toolbar</title>
<link rel="stylesheet" href="../../engine/exploragram.css">
<script defer src="../../engine/exploragram.js"></script>
<script src="harness.js"></script>
<script src="pointer.js"></script>
</head>
<body>
<section class="slide" id="t1"><h2>하나</h2></section>
<section class="slide" id="t2"><h2>둘</h2></section>
<pre id="results" data-summary="pending"></pre>
<script>
const I = () => Exploragram._internal;
const btn = (name) => document.querySelector(`.ch-toolbar [data-name="${name}"]`);
const key = (k, opts) => document.dispatchEvent(new KeyboardEvent('keydown', Object.assign({ key: k, bubbles: true, cancelable: true }, opts)));

test('툴바가 있고 처음에는 손 모드', () => {
  assert(document.querySelector('.ch-toolbar'), 'toolbar');
  eq(I().Tools.current, 'hand');
  eq(btn('hand').getAttribute('aria-pressed'), 'true');
});
test('도구 버튼과 단축키', () => {
  btn('pen').click();
  eq(I().Tools.current, 'pen');
  eq(btn('pen').getAttribute('aria-pressed'), 'true');
  key('h'); eq(I().Tools.current, 'hl');
  key('e'); eq(I().Tools.current, 'eraser');
  key('l'); eq(I().Tools.current, 'laser');
  key('p'); eq(I().Tools.current, 'pen');
  key('Escape'); eq(I().Tools.current, 'hand');
});
test('◀ ▶ 버튼은 펜을 든 채로도 넘긴다', () => {
  btn('pen').click();
  btn('next').click(); eq(I().Nav.state.slide, 1);
  btn('prev').click(); eq(I().Nav.state.slide, 0);
  eq(I().Tools.current, 'pen');
});
test('색 팝오버: 색을 고르면 펜 색이 바뀌고 닫힌다', () => {
  btn('style').click();
  const sw = document.querySelectorAll('.ch-pop .ch-swatch');
  eq(sw.length, 5);
  sw[1].click();
  eq(I().Tools.penColor, '#D7263D');
  eq(document.querySelector('.ch-pop'), null);
});
test('굵기 선택', () => {
  btn('style').click();
  document.querySelectorAll('.ch-pop .ch-width')[2].click();
  eq(I().Tools.penWidth, 12);
});
test('형광펜일 때는 형광펜 색 4개', () => {
  btn('hl').click();
  btn('style').click();
  eq(document.querySelectorAll('.ch-pop .ch-swatch').length, 4);
  document.querySelectorAll('.ch-pop .ch-swatch')[2].click();
  eq(I().Tools.hlColor, '#FFB3D1');
});
test('되돌리기 버튼과 Ctrl+Z', () => {
  btn('pen').click();
  drag(null, [100, 300], [300, 320]);
  drag(null, [100, 400], [300, 420]);
  eq(I().Ink.page.length, 2);
  btn('undo').click(); eq(I().Ink.page.length, 1);
  key('z', { ctrlKey: true }); eq(I().Ink.page.length, 0);
});
test('이 장 지우기는 묻지 않고 지우고, 되돌리기 한 번에 모두 돌아온다', () => {
  window.confirm = () => { throw new Error('native confirm'); };   // 기본 확인창은 쓰지 않는다
  drag(null, [100, 300], [300, 320]);
  drag(null, [100, 400], [300, 420]);
  btn('clear').click();
  eq(I().Ink.page.length, 0);
  btn('undo').click();
  eq(I().Ink.page.length, 2);
  btn('clear').click();
  eq(I().Ink.page.length, 0);
});
test('화면 안 확인창: 확인·취소·Esc·글자 입력', async () => {
  const { Ask } = I();
  let p = Ask.ask('지울까요?', { ok: '지우기' });
  const box = document.querySelector('.ch-ask');
  assert(box, 'dialog shown');
  eq(box.querySelector('.ch-ask-ok').textContent, '지우기');
  box.querySelector('.ch-ask-ok').click();
  eq(await p, true);
  assert(!document.querySelector('.ch-ask'), 'closed');
  p = Ask.ask('지울까요?');
  document.querySelector('.ch-ask-no').click();
  eq(await p, false);
  p = Ask.ask('지울까요?');
  document.querySelector('.ch-ask').dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  eq(await p, false);
  p = Ask.ask('반 이름', { input: '' });
  const input = document.querySelector('.ch-ask-input');
  input.value = '5반';
  input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
  eq(await p, '5반');
  const slide = I().Nav.state.slide;
  p = Ask.ask('알림', { alert: true });
  document.querySelector('.ch-ask-ok').dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
  eq(I().Nav.state.slide, slide);                   // 창 안의 키는 장을 넘기지 않는다
  document.querySelector('.ch-ask-ok').click();
  eq(await p, true);
});
test('위치 바꾸기: 아래 → 왼쪽, 화면 여백도 옮긴다', () => {
  btn('dock').click();
  eq(document.querySelector('.ch-toolbar').dataset.dock, 'left');
  eq(document.documentElement.style.getPropertyValue('--ch-reserve-left'), '80px');
  eq(document.documentElement.style.getPropertyValue('--ch-reserve-bottom'), '0px');
  btn('dock').click();
  btn('dock').click();
  eq(document.querySelector('.ch-toolbar').dataset.dock, 'bottom');
});
test('접기와 펼치기', () => {
  btn('collapse').click();
  assert(document.querySelector('.ch-toolbar').hidden, 'hidden');
  assert(!document.querySelector('.ch-tb-handle').hidden, 'handle shown');
  document.querySelector('.ch-tb-handle').click();
  assert(!document.querySelector('.ch-toolbar').hidden, 'shown again');
});
test('반 메뉴: 반을 추가하면 그 반으로 바뀌고 이름이 보인다', async () => {
  btn('class').click();
  [...document.querySelectorAll('.ch-pop .ch-menu-item')].find((b) => b.textContent.includes('반 추가')).click();
  await wait(50);
  document.querySelector('.ch-ask-input').value = '3반';
  document.querySelector('.ch-ask-ok').click();
  await wait(300);
  eq(I().Session.current, '3반');
  eq(btn('class').querySelector('span').textContent, '3반');
});
test('반 단추: 지금 반 이름이 색 알약으로 보이고, 반을 바꾸면 화면에 잠깐 알린다', async () => {
  const pill = getComputedStyle(btn('class').querySelector('span'));
  assert(pill.backgroundColor !== 'rgba(0, 0, 0, 0)' && parseFloat(pill.fontSize) >= 13, `알약 ${pill.backgroundColor} ${pill.fontSize}`);
  eq(btn('class').getAttribute('aria-label'), '반: 3반', '말줄임돼도 단추 이름에 반 이름 전체');
  const note = () => document.querySelector('.ch-notice');
  assert(note() && note().classList.contains('is-on'), '3반을 추가하며 바꿨을 때 알림');
  eq(note().textContent, '3반 판서로 바꿨어요');
  eq(note().getAttribute('role'), 'status');
  await I().Session.switchTo('기본');
  eq(note().textContent, '기본 판서로 바꿨어요');
  await wait(2200);
  assert(!note().classList.contains('is-on'), '2초쯤 뒤 사라진다');
  btn('dock').click();   // 왼쪽 붙임에서도 반 이름은 보인다(다른 단추 이름은 숨김)
  eq(document.querySelector('.ch-toolbar').dataset.dock, 'left');
  assert(getComputedStyle(btn('class').querySelector('span')).display !== 'none', '반 이름');
  eq(getComputedStyle(btn('next').querySelector('span')).display, 'none');
  btn('dock').click();
  btn('dock').click();
  eq(document.querySelector('.ch-toolbar').dataset.dock, 'bottom');
  await I().Session.switchTo('3반');
});
test('툴바 설정은 저장된다', async () => {
  await wait(100);
  const saved = await I().Store.get('toolbar');
  eq(saved.dock, 'bottom');
  eq(saved.penColor, '#D7263D');
  eq(saved.penWidth, 12);
});

test('툴바·팝오버·손잡이의 Enter·Space는 장을 넘기지 않고 기본 클릭을 허용한다', () => {
  const { Nav, Toolbar } = I();
  Nav.go(0);
  const press = (target) => {
    target.focus();
    for (const k of ['Enter', ' ']) {
      const e = new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true });
      target.dispatchEvent(e);
      eq(Nav.state.slide, 0, `${k}: slide`);
      eq(e.defaultPrevented, false, `${k}: default click allowed`);
    }
  };
  press(btn('pen'));
  btn('style').click();
  press(document.querySelector('.ch-pop .ch-swatch'));
  Toolbar.closePop();
  btn('class').click();
  press(document.querySelector('.ch-pop .ch-class'));
  Toolbar.closePop();
  Toolbar.setCollapsed(true);
  press(Toolbar.handle);
  Toolbar.setCollapsed(false);
  document.activeElement.blur();
});

test('Esc는 색·반 팝오버를 닫고 손 모드로 돌아간다', () => {
  for (const name of ['style', 'class']) {
    btn('pen').click();
    btn(name).click();
    assert(document.querySelector('.ch-pop'), `${name}: open`);
    key('Escape');
    eq(document.querySelector('.ch-pop'), null, `${name}: closed`);
    eq(I().Tools.current, 'hand');
  }
});

test('좌우 도킹의 도구 버튼도 최소 52px이다', () => {
  const T = I().Toolbar;
  for (const dock of ['left', 'right']) {
    T.prefs.dock = dock;
    T.applyDock();
    const rect = btn('pen').getBoundingClientRect();
    assert(rect.width >= 52 && rect.height >= 52, `${dock}: ${rect.width}×${rect.height}`);
  }
  T.prefs.dock = 'bottom';
  T.applyDock();
});
test('양옆 HUD: 탭을 누르면 판서 도구가 나오고, 고르면 들어간다', async () => {
  const T = I().Toolbar;
  for (const side of ['left', 'right']) {
    const hud = document.querySelector('.ch-hud[data-side="' + side + '"]');
    assert(hud && !hud.hidden, side + ' hud');
    const tab = hud.querySelector('.ch-hud-tab');
    const r = tab.getBoundingClientRect();
    assert(side === 'left' ? r.left <= 1 : r.right >= innerWidth - 1, side + ' edge');
    assert(r.width <= 24 && r.height <= 64, side + ' small tab ' + r.width + '×' + r.height);
    eq(hud.dataset.edge, side);
    eq(getComputedStyle(hud.querySelector('.ch-hud-panel')).display, 'none');
    tab.click();
    eq(tab.getAttribute('aria-expanded'), 'true');
    hud.querySelector('[data-tool="pen"]').click();
    eq(I().Tools.current, 'pen');
    assert(!hud.classList.contains('is-open'), 'closes after pick');
    eq(btn('pen').getAttribute('aria-pressed'), 'true');   // 아래 툴바와 같이 맞춘다
    await wait(400);                                       // 두 번 톡(모드 전환)으로 읽히지 않게
    tab.click();
    hud.querySelector('[data-tool="pen"]').click();       // 고른 펜을 다시: 색 고르기
    assert(document.querySelector('.ch-pop .ch-swatches'), 'style pop');
    T.closePop();
    hud.querySelector('[data-tool="hand"]').click();
    await wait(400);
  }
  eq(I().Tools.current, 'hand');
});
test('HUD의 슬라이드 | 칠판도 지금 쪽에 불이 들어온다', () => {
  const hud = document.querySelector('.ch-hud[data-side="left"]');
  hud.querySelector('.ch-hud-tab').click();
  hud.querySelector('[data-name="board"]').click();
  assert(I().Board.active, 'board on');
  eq(hud.querySelector('[data-name="board"]').getAttribute('aria-pressed'), 'true');
  eq(hud.querySelector('[data-name="slides"]').getAttribute('aria-pressed'), 'false');
  hud.querySelector('[data-name="slides"]').click();
  assert(!I().Board.active, 'board off');
  eq(hud.querySelector('[data-name="slides"]').getAttribute('aria-pressed'), 'true');
  I().Toolbar.setHud(hud, false);
});
test('툴바가 왼쪽에 붙어 펼쳐져 있으면 왼쪽 HUD는 숨고, 접으면 다시 나온다', () => {
  const T = I().Toolbar;
  const left = document.querySelector('.ch-hud[data-side="left"]');
  T.prefs.dock = 'left';
  T.applyDock();
  eq(left.hidden, true);
  T.setCollapsed(true);
  eq(left.hidden, false);
  T.setCollapsed(false);
  T.prefs.dock = 'bottom';
  T.applyDock();
  eq(left.hidden, false);
});
test('HUD 탭을 끌면 화면 어디로든 옮겨지고(동그란 단추), 끝에 놓으면 다시 붙으며 자리는 저장된다', async () => {
  const T = I().Toolbar;
  const hud = document.querySelector('.ch-hud[data-side="left"]');
  const tab = hud.querySelector('.ch-hud-tab');
  const at = (type, x, y) => tab.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 9, pointerType: 'touch', isPrimary: true, clientX: x, clientY: y, buttons: type === 'pointerup' ? 0 : 1 }));
  const r = tab.getBoundingClientRect();
  at('pointerdown', r.left + 5, r.top + 10);
  at('pointermove', 400, 300);
  at('pointermove', 500, 260);
  at('pointerup', 500, 260);
  tab.click();                                      // 끌기 끝의 클릭은 도구판을 열지 않는다
  assert(!hud.classList.contains('is-open'), 'not opened by drag');
  eq(hud.dataset.edge, '');
  await wait(400);
  const f = tab.getBoundingClientRect();
  assert(Math.abs(f.width - 44) < 1 && f.left > 300, 'floating ' + f.left);
  tab.click();
  assert(hud.classList.contains('is-open'), 'tap opens');
  const panel = hud.querySelector('.ch-hud-panel').getBoundingClientRect();
  assert(panel.left >= f.right, 'panel opens toward center');
  assert(panel.top >= 0 && panel.bottom <= innerHeight, 'panel inside screen');
  T.setHud(hud, false);
  await wait(100);
  const saved = await I().Store.get('toolbar');
  assert(saved.hud.left.x > 0 && saved.hud.left.x < 1, 'saved float x');
  // 오른쪽 끝 가까이 놓으면 오른쪽에 붙는다
  const g = tab.getBoundingClientRect();
  at('pointerdown', g.left + 10, g.top + 10);
  at('pointermove', innerWidth - 20, 200);
  at('pointerup', innerWidth - 20, 200);
  eq(hud.dataset.edge, 'right');
  assert(tab.getBoundingClientRect().right >= innerWidth - 1, 'snapped right');
  // 원래 자리로
  T.prefs.hud.left = { x: 0, y: 0.5 };
  T.placeHud(hud);
  T.savePrefs();
  eq(hud.dataset.edge, 'left');
});
test('HUD 탭을 두 번 톡 누르면 가장자리 ↔ 떠 있기가 바뀌고, 떠 있던 자리를 기억한다', async () => {
  const T = I().Toolbar;
  const hud = document.querySelector('.ch-hud[data-side="right"]');
  const tab = hud.querySelector('.ch-hud-tab');
  await wait(400);
  eq(hud.dataset.edge, 'right');
  tab.click(); tab.click();
  eq(hud.dataset.edge, '');
  assert(!hud.classList.contains('is-open'), 'panel closed after double tap');
  assert(tab.getBoundingClientRect().right < innerWidth - 20, 'floating away from edge');
  T.prefs.hud.right = { x: 0.5, y: 0.3 };                 // 떠 있는 자리를 옮겨 둔다
  T.placeHud(hud);
  await wait(400);
  tab.click(); tab.click();
  eq(hud.dataset.edge, 'right');
  eq(T.prefs.hudFloat.right, { x: 0.5, y: 0.3 });
  await wait(400);
  tab.click(); tab.click();
  eq(T.prefs.hud.right, { x: 0.5, y: 0.3 });             // 기억한 자리로 다시 뜬다
  await wait(400);
  tab.click(); tab.click();
  eq(hud.dataset.edge, 'right');
  await wait(100);
  eq((await I().Store.get('toolbar')).hudFloat.right, { x: 0.5, y: 0.3 });
  await wait(400);
});
test('색 창이 열려 있을 때 무대를 누르면 닫기만 하고 판서가 되지 않는다', () => {
  I().Tools.set('pen');
  btn('style').click();
  assert(document.querySelector('.ch-pop'), 'pop open');
  const before = I().Ink.page.length;
  drag(null, [300, 300], [400, 320]);
  assert(!document.querySelector('.ch-pop'), 'pop closed');
  eq(I().Ink.page.length, before);
  I().Tools.set('hand');
});
</script>
</body>
</html>
