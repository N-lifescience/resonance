# 전기장 속 이온은 어디로 갈까?
[끌려가기]
왼쪽: (−)극
오른쪽: (+)극
켜기: 전원
고르기: 소금물 = Na⁺ 왼쪽 2, Cl⁻ 오른쪽 2
고르기: 염화 칼슘 수용액 = Ca²⁺ 왼쪽 2, Cl⁻ 오른쪽 4
처음: 전원을 켜기 전에는 두 종류의 이온이 섞여 있다.
끝: 양이온은 (−)극으로, 음이온은 (+)극으로 이동한다.

# 용액에 전류가 흐를까?
[고르기] 용액을 바꾸어 비교해 보자.
값: 모형 속 이온 수 | 개
그림: 전구
- 설탕 수용액 = 0 | 설탕은 물에 녹아도 이온으로 나뉘지 않는다.
- 소금물 = 6 | 물속에서 움직이는 이온이 전하를 운반한다.

# 전자를 잃거나 얻으면?
[전자 이동]
- Na 나트륨 11 잃음 1
- Mg 마그네슘 12 잃음 2
- O 산소 8 얻음 2
- Cl 염소 17 얻음 1

# 일정한 속력으로 움직이면?
[그래프] 시간이 두 배가 되면 이동 거리는?
가로: t 0~10 0.5 | 시간 | 초 | 재생
세로: 0~30 | 이동 거리 | m
식: v * t
고르기: v = 1 | 1 m/s, 2 | 2 m/s, 3 | 3 m/s
문장: t == 0 → 속력을 고른 뒤 재생해 보자.
문장: t > 0 → 속력이 일정하면 이동 거리는 시간에 비례한다.

# 막을 사이에 두고 입자가 움직이면?
[퍼지기]
막: 있음 | 왼쪽 | 오른쪽
- 물 30 30 통과 파랑
- 설탕 20 5 막힘 주황

# 소금이 물에 녹는 과정
[단계] 고체 속 이온은 물속에서 어떻게 될까?
- 고체 | 고체 안에서 양이온과 음이온이 규칙적으로 배열되어 있다.
- 물에 넣음 | 물 분자가 고체 표면의 이온을 둘러싼다.
- 수용액 | 이온들이 물 분자에 둘러싸인 채 흩어져 움직인다.

# 산화 이온의 전하
[퀴즈] 중성 산소 원자가 전자 두 개를 얻으면?
- O²⁺ | 전자를 얻으면 음전하가 더 많아진다.
* O²⁻ | 전자 두 개를 얻어 전하가 −2가 된다.
- O⁻ | 전자 두 개를 얻었으므로 2도 써야 한다.

# 이온을 전하에 따라 나누자
[분류] 양이온 | 음이온
- Na⁺ = 양이온 | 전자를 하나 잃은 이온이다.
- Mg²⁺ = 양이온 | 전자를 두 개 잃은 이온이다.
- Cl⁻ = 음이온 | 전자를 하나 얻은 이온이다.
- O²⁻ = 음이온 | 전자를 두 개 얻은 이온이다.

# 소금물은 어떻게 만들까?
[순서] 소금물을 만드는 순서대로 놓아 보자.
- 비커에 물을 담는다. | 소금을 녹일 물을 준비한다.
- 소금을 넣는다. | 물에 녹일 물질을 넣는다.
- 유리 막대로 저어 녹인다. | 소금이 물에 골고루 섞이게 한다.

# 이온 모형 두 가지를 비교하자
Q. 두 모형에서 전자 수는 어떻게 달라졌을까?
- 나트륨 원자는 전자를 {하나 잃어} Na⁺이 된다.
- 염소 원자는 전자를 {하나 얻어} Cl⁻이 된다.
[그림 7-4] 나트륨 원자가 양이온이 되는 모형
[그림 8-1] 염소 원자가 음이온이 되는 모형
