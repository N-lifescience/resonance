# [표지] 호흡
중학교 2학년 과학 · Ⅴ. 동물과 에너지

[묶음] 1. 호흡계
# 공기는 어떤 길로 폐까지 갈까?
- 코 → 기관 → 기관지 → 폐 순서로 공기가 들어간다.
- 폐는 수많은 {폐포}로 이루어져 있다.
- 폐포는 {모세혈관}으로 둘러싸여 있다.
[그림 3-2] 사람의 호흡계

# 폐포가 많으면 무엇이 좋을까?
- 폐포가 많아 공기와 닿는 {표면적}이 넓다.
> 그래서 기체 교환이 효율적으로 일어난다.
[그림 4-1] 폐포와 모세혈관

# [순서] 공기가 들어가는 길을 순서대로 놓아 보자.
- 코 | 공기가 처음 들어오는 곳이다.
- 기관 | 목 앞쪽의 굵은 관이다.
- 기관지 | 기관이 두 갈래로 나뉜다.
- 폐포 | 기체 교환이 일어난다.

# [장표지] 2. 호흡 운동

# 숨을 들이쉬면 가슴 속은 어떻게 변할까?
- 폐는 근육이 없어 스스로 커지거나 작아지지 못한다.
- 갈비뼈와 {가로막}의 움직임으로 숨을 쉰다.
[그림 7-3] 호흡 운동 모형

# [단계] 들숨이 일어나는 과정
- 갈비뼈 | 갈비뼈가 위로 올라간다.
- 가로막 | 가로막이 아래로 내려간다.
- 흉강 | 흉강의 부피가 커지고 압력이 낮아진다.
- 들숨 | 바깥 공기가 폐 안으로 들어온다.

# 들숨과 날숨은 무엇이 다를까?
| 구분 | 갈비뼈 | 가로막 | 흉강 부피 |
| 들숨 | 올라간다 | 내려간다 | 커진다 |
| 날숨 | 내려간다 | 올라간다 | 작아진다 |

# [분류] 들숨 | 날숨
- 가로막이 내려간다 = 들숨 | 흉강이 커진다.
- 갈비뼈가 내려간다 = 날숨 | 흉강이 작아진다.
- 폐 속 압력이 낮아진다 = 들숨 | 공기가 들어온다.
- 공기가 몸 밖으로 나간다 = 날숨 | 폐 속 압력이 높아졌다.

# [장표지] 3. 기체 교환

# 폐포에서 산소와 이산화 탄소는 어디로 갈까?
- 기체는 농도가 {높은} 곳에서 {낮은} 곳으로 확산한다.
- 폐포의 산소는 모세혈관으로, 모세혈관의 이산화 탄소는 폐포로 이동한다.
[그림 11-2] 폐포에서의 기체 교환

# [퍼지기] 폐포와 모세혈관 사이의 기체 교환
막: 있음 | 폐포 | 모세혈관
- 산소 24 4 통과 빨강
- 이산화 탄소 4 24 통과 파랑

# [퀴즈] 조직 세포에서 산소는 어디로 이동할까?
* 모세혈관에서 조직 세포로 | 맞다. 조직 세포의 산소 농도가 더 낮다.
- 조직 세포에서 모세혈관으로 | 이산화 탄소가 이렇게 이동한다.
- 이동하지 않는다 | 농도 차이가 있으면 확산한다.

# 정리
- 공기는 코, 기관, 기관지를 지나 폐포에 이른다.
- 갈비뼈와 가로막이 움직여 들숨과 날숨이 일어난다.
- 폐포와 조직 세포에서 기체는 확산으로 교환된다.
