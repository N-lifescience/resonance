# [표지] 확산과 삼투
고등학교 생명과학 · 세포막을 통한 물질 이동

[묶음] 1. 확산
# 향수 냄새는 어떻게 방 안에 퍼질까?
Q. 바람이 없는데도 냄새가 퍼지는 까닭은 무엇일까?
> 분자는 스스로 끊임없이 움직인다.
> 그래서 농도가 높은 곳에서 낮은 곳으로 퍼져 나간다.

# 확산이란 무엇일까?
- 확산: 분자가 {농도가 높은 곳}에서 {농도가 낮은 곳}으로 퍼져 나가는 현상
- 확산은 에너지를 쓰지 않는다.
- 양쪽 농도가 같아지면 겉보기 이동이 멈춘다.
[그림 3-2] 잉크가 물에 퍼지는 모습

# 잉크 분자는 어떻게 퍼져 나갈까?
[퍼지기]
막: 없음 | 왼쪽 | 오른쪽
- 잉크 40 0 통과 보라

# [장표지] 2. 삼투

# 삼투란 무엇일까?
- 삼투: 반투과성 막을 사이에 두고 {물}이 용질의 농도가 {낮은} 쪽에서 {높은} 쪽으로 이동하는 현상
- 반투과성 막은 물은 통과시키고 설탕 같은 큰 분자는 통과시키지 않는다.
[그림 6-1] 반투과성 막과 삼투

# 물은 어느 쪽으로 더 많이 움직일까?
[퍼지기]
막: 있음 | 세포 밖 | 세포 안
- 물 30 30 통과 파랑
- 설탕 5 20 막힘 주황

# 시간이 지나면 빨대 속 물은 얼마나 올라갈까?
[그래프] 설탕물 농도를 고르고 재생해 보자.
가로: t 0~10 0.5 | 시간 | 분 | 재생
세로: 0~9 | 올라간 높이 | 칸
식: 8 * c * (1 - exp(-t / 3))
고르기: c = 0.5 | 0.5 M, 1 | 1 M
문장: t == 0 → 「재생」을 누르고 빨대 속 물을 지켜보자.
문장: t > 0 && t < 10 → 물이 튜브 안으로 들어와 빨대 속 물이 오른다.
문장: t == 10 → 처음에는 빨리 오르다가 점점 느려진다.

# 적혈구를 여러 용액에 넣으면?
[고르기] 용액을 골라 적혈구의 부피를 살펴보자.
값: 적혈구 부피 | %
그림: 막대
- 저장액(증류수) = 130 | 물이 들어와 부풀고, 심하면 터진다.
- 등장액(0.9% 소금물) = 100 | 들어오고 나가는 물이 같아 모양이 그대로다.
- 고장액(진한 소금물) = 70 | 물이 빠져나가 쭈그러든다.

# 식물 세포를 고장액에 넣으면?
[단계] 원형질 분리
- 처음 | 세포막이 세포벽에 붙어 있다.
- 물이 빠져나감 | 고장액으로 물이 빠져나가 액포가 작아진다.
- 원형질 분리 | 세포막이 세포벽에서 떨어진다.

# 확산과 삼투 구분하기
[분류] 확산 | 삼투
- 향수 냄새가 퍼진다 = 확산 | 분자가 농도가 낮은 곳으로 퍼진다.
- 김치를 절이면 배추가 숨이 죽는다 = 삼투 | 배추 세포에서 물이 빠져나간다.
- 폐포에서 산소가 혈액으로 들어간다 = 확산 | 산소가 농도가 낮은 혈액 쪽으로 이동한다.
- 물에 담근 건포도가 부푼다 = 삼투 | 물이 건포도 안으로 들어간다.

# 확인 문제
[퀴즈] 삼투에서 이동하는 것은 무엇일까?
- 용질 | 용질은 반투과성 막을 통과하지 못한다.
* 물 | 맞다. 삼투는 물의 이동이다.
- 막 | 막은 움직이지 않는다.

# 정리
- 확산은 분자가 농도가 높은 곳에서 낮은 곳으로 퍼지는 현상이다.
- 삼투는 반투과성 막을 사이에 두고 물이 용질 농도가 높은 쪽으로 이동하는 현상이다.
