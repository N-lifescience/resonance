# [표지] 전하를 띠는 이온
중학교 2학년 과학 · Ⅰ. 물질의 구성

[묶음] 생각 열기
# 운동한 뒤 왜 이온 음료를 마실까?
Q. 땀을 많이 흘린 뒤 마시는 음료에는 무엇이 들어 있을까?
> 이온 음료에는 땀으로 빠져나간 성분이 들어 있다.
> 그런데 '이온'은 무엇일까?
[그림 2-5] 이온 음료 광고 화면

# [장표지] 1. 전하를 띠는 이온

# 학습 목표
- 이온의 형성 과정을 모형과 이온식으로 표현할 수 있다.
- 이온이 전하를 띠고 있음을 설명할 수 있다.
Q. 리튬 이온은 어떻게 만들어질까?
답: 리튬 원자가 전자를 하나 잃으면 리튬 이온이 된다.

# 원자는 왜 전기적으로 중성일까?
[꼬리표] 되짚어보기
- 원자는 {원자핵}과 {전자}로 구성되어 있다.
- {원자핵}은 (+)전하를 띠고, {전자}는 (−)전하를 띤다.
- 원자는 전기적으로 {중성}이다.

# 이온이란 무엇일까?
- 전기적으로 {중성}인 원자가 {전자}를 잃거나 얻어 {전하}를 띠는 입자
Q. 전자는 어떻게 잃고 얻을 수 있을까?
> 전자는 원자핵과 달리 움직이기 때문에 일부는 다른 원자로 쉽게 이동할 수 있다.
> 어떤 원자는 다른 원자에게 전자를 주고, 어떤 원자는 전자를 받는다.
[그림 6-5] 전자를 주고받는 원자 모형

# 전자를 잃으면 어떤 전하를 띨까?
[꼬리표] 양이온
- 원자가 전자를 {잃어} (+)전하를 띠는 입자
- 양이온이 되기 쉬운 원자: Li, Na, K, Ca 등 금속 원자
- 전자를 잃으면 (+)전하의 양이 상대적으로 {많아지므로} (+)전하를 띤다.
[그림 7-4] 원자가 전자를 잃어 양이온이 되는 모형

# 전자를 얻으면 어떤 전하를 띨까?
[꼬리표] 음이온
- 원자가 전자를 {얻어} (−)전하를 띠는 입자
- 음이온이 되기 쉬운 원자: F, O, Cl, S 등 비금속 원자
- 전자를 얻으면 (−)전하의 양이 상대적으로 {많아지므로} (−)전하를 띤다.
[그림 8-1] 원자가 전자를 얻어 음이온이 되는 모형

# 원자가 전자를 잃거나 얻으면 어떻게 될까?
[전자 이동]
- Li 리튬 3 잃음 1
- Na 나트륨 11 잃음 1
- Mg 마그네슘 12 잃음 2
- O 산소 8 얻음 2
- F 플루오린 9 얻음 1
- Cl 염소 17 얻음 1

# 원자는 왜 이온이 될까?
- 전자는 2, 10, 18개가 모이면 안정하고, 그렇지 않으면 불안정하다.
- 안정해지기 위해 전자를 잃거나 얻으며, 이 과정에서 이온이 된다.
> 이때 적은 수의 전자 변화로 안정해지려고 한다.

# 양이온은 어떻게 나타낼까?
[꼬리표] 이온식
- 이온식: 이온이 띠는 {전하}의 종류와 잃거나 얻은 {전자 수}를 함께 나타낸 식
- 양이온은 원소 기호의 {오른쪽 위}에 잃은 전자 수와 +를 쓴다.
| 이온 | 나트륨 이온 | 구리 이온 | 칼슘 이온 | 마그네슘 이온 |
| 이온식 | Na⁺ | Cu²⁺ | Ca²⁺ | Mg²⁺ |

# 음이온은 어떻게 나타낼까?
- 음이온은 원소 기호의 {오른쪽 위}에 얻은 전자 수와 −를 쓴다.
| 이온 | 플루오린화 이온 | 황화 이온 | 산화 이온 | 염화 이온 |
| 이온식 | F⁻ | S²⁻ | O²⁻ | Cl⁻ |

# 이온의 이름은 어떻게 붙일까?
- 양이온: 원소 이름 뒤에 '{이온}'을 붙인다. 예: 나트륨 이온
- 음이온: 원소 이름 뒤에 '{화 이온}'을 붙인다. 이름이 '소'로 끝나면 '소'를 뺀다. 예: 염화 이온
- 다원자 이온: {여러 개}의 원자가 모여 {하나의 이온}처럼 행동하며, 각자 {고유한 이름}을 가진다.
| 이름 | 암모늄 이온 | 탄산 이온 | 황산 이온 | 질산 이온 |
| 이온식 | NH₄⁺ | CO₃²⁻ | SO₄²⁻ | NO₃⁻ |

# O²⁻의 이름은 무엇일까?
[퀴즈] O²⁻의 이름은 무엇일까?
- 산소 이온 | 음이온은 원소 이름 뒤에 '화 이온'을 붙인다.
* 산화 이온 | 맞다. '소'로 끝나므로 '소'를 빼고 '화 이온'을 붙인다.
- 산소화 이온 | 이름이 '소'로 끝나면 '소'를 뺀다.

# 이온 모형과 이온식 표현하기
- 빈칸에 이온 모형과 이온식을 표현해 보자.
[그림 12-6] 이온 모형과 이온식 빈칸 활동지

# [장표지] 2. 이온이 전하를 띠는지 확인하기

# 간이 전도계로 어떻게 확인할까?
- 각 물질에 간이 전도계의 {전극}을 꽂는다.
- 소리가 나면 {전기}가 통하고, 소리가 나지 않으면 통하지 않는다.
- 전기가 통하면 {이온}이 들어 있음을 알 수 있다.
> 이온은 {전하}를 {운반}하므로 이온이 든 용액에서는 전기가 통한다.
[그림 13-4] 간이 전기 전도계

# 실험 영상
[그림 14-5] 전하를 띠는 이온 실험 영상 화면

# 탐구는 어떤 순서로 할까?
[순서] 탐구 순서대로 놓아 보자.
- 6홈 판에 증류수와 이온 음료를 각각 넣는다. | 비교할 물질을 먼저 준비한다.
- 간이 전기 전도계의 전극을 담가 전기가 통하는지 확인한다. | 소리로 전기가 통하는지 안다.
- 물질을 바꿀 때마다 전극을 씻는다. | 앞 물질이 섞이지 않게 한다.
- 염화 나트륨 수용액과 설탕 수용액으로 과정을 되풀이한다. | 녹인 물질을 바꿔 비교한다.

# 어떤 용액에 전기가 통할까?
[고르기] 용액을 골라 전구를 살펴보자.
값: 용액 속 이온 수 | 개
그림: 전구
- 증류수 = 0 | 전기가 통하지 않는다. 이온이 거의 없다.
- 이온 음료 = 4 | 전기가 통한다. 이온이 들어 있다.
- 설탕 수용액 = 0 | 전기가 통하지 않는다. 설탕은 물에 녹아도 이온으로 나누어지지 않는다.
- 염화 나트륨 수용액 = 6 | 전기가 통한다. 염화 나트륨은 물에 녹아 이온으로 나누어진다.

# 전기가 통하는 물질과 통하지 않는 물질
[분류] 전기가 통한다 | 전기가 통하지 않는다
- 이온 음료 = 전기가 통한다 | 이온이 들어 있다.
- 염화 나트륨 수용액 = 전기가 통한다 | 물에 녹아 이온으로 나누어진다.
- 증류수 = 전기가 통하지 않는다 | 이온이 거의 없다.
- 설탕 수용액 = 전기가 통하지 않는다 | 설탕은 이온으로 나누어지지 않는다.

# 전기가 통하는 물질의 공통점은?
Q. 전기가 통하는 물질의 공통점을 토의해 보자.
> 증류수는 전기가 통하지 않고, 이온 음료는 통한다. 이온이 든 용액은 전기가 통한다.
> 염화 나트륨 수용액도 통하므로, 이 용액에도 이온이 들어 있다고 유추할 수 있다.
> 따라서 전기가 통하는 물질에는 모두 이온이 들어 있다.

# 이온이 든 용액은 왜 전기가 통할까?
Q. 이온이 든 용액이 전기가 통하는 까닭을 설명해 보자.
> 전기가 통하는 용액에는 전하를 띠는 입자가 들어 있다.
> 이온은 전하를 띠는 입자이므로, 이온이 든 용액에서는 전기가 통한다.

# 소금물은 통하고 설탕물은 통하지 않는 까닭은?
- 염화 나트륨은 물에 녹아 염화 이온과 나트륨 이온으로 나누어진다.
- 설탕은 물에 녹아도 이온으로 나누어지지 않는다.
> 이온화: 물질이 {물}에 녹아 {양이온}과 {음이온}으로 나누어지는 현상
[그림 19-9] 염화 나트륨과 설탕이 물에 녹는 모형

# [장표지] 3. 이온의 이동

# 이온은 어느 극으로 끌려갈까?
[끌려가기]
왼쪽: (−)극
오른쪽: (+)극
켜기: 전원
고르기: 염화 나트륨 수용액 = Na⁺ 왼쪽 2, Cl⁻ 오른쪽 2
고르기: 질산 은 수용액 = Ag⁺ 왼쪽 2, NO₃⁻ 오른쪽 2
처음: 전원을 켜기 전에는 이온이 고르게 흩어져 있다.
끝: 양이온은 (−)극으로, 음이온은 (+)극으로 끌려간다.

# 이온의 이동 정리
- 양이온은 전기적 {인력}에 의해 (−)극 쪽으로 끌려간다.
- 음이온은 전기적 {인력}에 의해 (+)극 쪽으로 끌려간다.

# 적용해보기
Q. 각 수용액에서 (+)극과 (−)극으로 가는 이온을 쓰시오.
[그림 21-5] 염화 나트륨 수용액에 전극을 넣은 그림
[그림 21-6] 질산 은 수용액에 전극을 넣은 그림
> 염화 나트륨 수용액: (+)극 Cl⁻, (−)극 Na⁺
> 질산 은 수용액: (+)극 NO₃⁻, (−)극 Ag⁺

# 질산 은 수용액에서 (−)극으로 가는 이온은?
[퀴즈] 질산 은 수용액에 전극을 넣으면 (−)극으로 가는 이온은?
- NO₃⁻ | 음이온이라 (+)극으로 끌려간다.
* Ag⁺ | 맞다. 양이온은 (−)극으로 끌려간다.
- H₂O | 물 분자는 전하를 띠지 않는다.

# 양이온과 음이온으로 나누어 보자
[분류] 양이온 | 음이온
- Na⁺ = 양이온 | 나트륨 원자가 전자 1개를 잃었다.
- Cl⁻ = 음이온 | 염소 원자가 전자 1개를 얻었다.
- Mg²⁺ = 양이온 | 마그네슘 원자가 전자 2개를 잃었다.
- O²⁻ = 음이온 | 산소 원자가 전자 2개를 얻었다.
- NH₄⁺ = 양이온 | (+)전하를 띠는 다원자 이온이다.
- SO₄²⁻ = 음이온 | (−)전하를 띠는 다원자 이온이다.

# 정리
- 원자가 전자를 잃거나 얻어 전하를 띠는 입자를 {이온}이라고 한다.
- 중성 원자가 전자를 잃으면 {양이온}이 되고, 전자를 얻으면 {음이온}이 된다.
Q. 젖은 손으로 전기 기구를 만지면 왜 감전될 수 있을까?
답: 손에 묻은 물질이 물에 녹아 이온으로 나누어지면 전기가 통할 수 있기 때문이다.
