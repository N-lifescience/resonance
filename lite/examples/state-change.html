# [표지] 상태 변화와 열에너지
중학교 1학년 과학 · 물질의 상태 변화

[묶음] 1. 상태 변화
# 물질의 상태는 어떻게 바뀔까?
- 고체가 액체로 변하는 것을 {융해}라고 한다.
- 액체가 기체로 변하는 것을 {기화}라고 한다.
- 기체가 액체로 변하는 것을 {액화}, 액체가 고체로 변하는 것을 {응고}라고 한다.
[그림 2-3] 물질의 세 가지 상태

# [단계] 얼음이 녹을 때 입자 배열은?
- 고체 | 입자가 규칙적으로 배열되어 있다.
- 융해 | 입자의 배열이 흐트러진다.
- 액체 | 입자가 비교적 자유롭게 움직인다.

# [장표지] 2. 상태 변화와 열에너지

# 얼음을 계속 가열하면 온도는 어떻게 될까?
- 얼음을 가열하면 온도가 오르다가 녹는 동안에는 온도가 {일정}하다.
- 이때 가한 열은 {상태 변화}에 쓰인다.
[그림 6-1] 얼음의 가열 곡선

# [그래프] 시간에 따라 온도는 어떻게 변할까?
가로: t 0~12 0.5 | 가열 시간 | 분 | 재생
세로: -20~110 | 온도 | ℃
식: t < 2 ? -20 + 10 * t : t < 5 ? 0 : t < 10 ? 20 * (t - 5) : 100
문장: t < 2 → 얼음의 온도가 올라간다.
문장: t >= 2 && t < 5 → 얼음이 녹는 동안 온도가 0 ℃로 일정하다.
문장: t >= 5 && t < 10 → 물의 온도가 올라간다.
문장: t >= 10 → 물이 끓는 동안 온도가 100 ℃로 일정하다.

# [분류] 열을 흡수 | 열을 방출
- 융해 = 열을 흡수 | 고체가 녹으며 열을 흡수한다.
- 기화 = 열을 흡수 | 액체가 기체가 되며 열을 흡수한다.
- 응고 = 열을 방출 | 액체가 굳으며 열을 방출한다.
- 액화 = 열을 방출 | 기체가 액체가 되며 열을 방출한다.

# 생활 속에서 찾아보자
- 여름철 마당에 물을 뿌리면 시원해진다. 물이 {기화}하며 열을 흡수하기 때문이다.
- 이글루 안에 물을 뿌리면 따뜻해진다. 물이 {응고}하며 열을 방출하기 때문이다.

# [퀴즈] 물이 끓는 동안 온도가 일정한 까닭은?
* 가한 열이 상태 변화에 쓰이기 때문이다 | 맞다. 기화에 열이 쓰인다.
- 열을 더 이상 받지 않기 때문이다 | 계속 가열하고 있다.
- 물의 양이 줄지 않기 때문이다 | 끓는 동안 물의 양은 준다.

# 정리
- 융해, 기화가 일어날 때 열을 흡수한다.
- 응고, 액화가 일어날 때 열을 방출한다.
- 상태가 변하는 동안에는 온도가 일정하다.
